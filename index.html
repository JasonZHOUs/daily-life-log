const fresh=()=>({days:{},foods:[],dbx:[],t:{},gm:{},meals:[],tpl:null,lang:'',sched:[],stat:null,rem:{},tz:'',cal_tok:'',tpls:{},bin:[],timer:null,favs:[]});

const pref=(k,v)=>{try{if(v===undefined)return localStorage.getItem(KEY+':'+k);if(v===null)localStorage.removeItem(KEY+':'+k);else localStorage.setItem(KEY+':'+k,v)}catch(e){}return null};
let S=fresh(),SK=null;
S.lang=pref('lang')||'zh';
function persist(){if(!SK)return;try{localStorage.setItem(SK,JSON.stringify(S))}catch(e){}}
function loadSlot(k){
  let o=null;
  try{const r=localStorage.getItem(k);if(r)o=JSON.parse(r)}catch(e){}
  if(!o){try{const lg=localStorage.getItem(KEY);if(lg){o=JSON.parse(lg);localStorage.setItem(KEY+':legacy',lg);localStorage.removeItem(KEY)}}catch(e){}}

  const uni=(x,y,key,type)=>{const out=[],seen=new Set();(x||[]).concat(y||[]).forEach(e=>{const q=key(e);if(seen.has(q)||gone.has(type+'|'+JSON.stringify(e)))return;seen.add(q);out.push(e)});return out};

/* ---------- plan ↔ records (Phase 1) ----------
   A plan item's kinds come from its text, so old days and edited templates work without migration.

const KINDS=[['meal_b',/早餐|breakfast/i],['meal_s',/加餐|snack/i],['sup',/补剂|补充剂|supplement|鱼油|镁片|肌酸|维生素/i],['gym',/健身|\bgym\b|workout/i],
  ['eng',/口语|spoken english/i],['note',/睡前小结|night note/i],['weigh',/称重|weigh-in/i],['lab',/^实验(到|（|\(|$)|^lab\b/i],['ai',/AI ?项目|AI project/i]];
function kindsOf(x){
  const out=[];
  KINDS.forEach(k=>{if(k[1].test(x.n||'')||k[1].test(x.z||''))out.push(k[0]==='sup'?((x.t||'')<'15:00'?'sup_am':'sup_pm'):k[0])});

const minOf=ms=>{const t0=new Date(ms);return t0.getHours()*60+t0.getMinutes()};
function ate(d,k,a,b){
  const timed=d.food.filter(e=>e.at&&ymd(new Date(e.at))===k);
  if(timed.some(e=>{const m=minOf(e.at);return m>=a&&m<=b}))return {ok:true};
  return {ok:false,maybe:d.food.some(e=>!e.at)};
}
function kindEv(d,k,kind){
  if(kind==='meal_b')return ate(d,k,0,690);       // until 11:30
  if(kind==='meal_s')return ate(d,k,840,1080);    // 14:00 to 18:00
  if(kind==='sup_am'||kind==='sup_pm'){const g=kind.slice(4),it=SUPS.filter(s=>s[1]===g),n=it.filter(s=>d.sp[s[0]]).length;return {ok:n===it.length,part:n?n+'/'+it.length:''}}
  if(kind==='gym')return {ok:d.gym.length>0||d.wk.some(w=>w.s.length)};
  if(kind==='eng')return {ok:!!d.eng};

const VAPID_PUB='BErwRNr7p821FnB-t8b44r2Q8An1gz31nI6EVlmYYR9SgEgBPtE4RIYylGbIlmL36hj31xS5DA0ngGRwZs764Ak';

function buildSched(){
  const td=ymd(new Date()),out=[];
  for(let i=0;i<14;i++){
    const k=shift(td,i),it=planPreview(k).slice().sort((a,b)=>a.t<b.t?-1:a.t>b.t?1:0);

  const W0=300,H0=118,top=8,bot=96,n=s.length,tg=metTgt(m),bar=BARS.indexOf(m)>=0,all=vals.concat(tg!=null?[tg]:[]);
  let lo=Math.min.apply(null,all),hi=Math.max.apply(null,all);
  if(m==='mood'||m==='nrg'){lo=1;hi=5}else if(bar){lo=0;hi=hi*1.08||1}else{const pd=(hi-lo)*.15||(m==='wt'?.5:1);lo-=pd;hi+=pd}
  const cw=(W0-8)/n,x=i=>4+cw*i+cw/2,y=v=>bot-(v-lo)/(hi-lo||1)*(bot-top),r1=v=>Math.round(v*10)/10;
  let g='';
  if(tg!=null&&tg>=lo&&tg<=hi)g+='<line x1="4" x2="'+(W0-4)+'" y1="'+r1(y(tg))+'" y2="'+r1(y(tg))+'" class="tg"/>';
  if(bar)s.forEach((p,i)=>{if(p.v==null)return;const bw=Math.max(2,cw*.62),yy=y(p.v);g+='<rect x="'+r1(x(i)-bw/2)+'" y="'+r1(yy)+'" width="'+r1(bw)+'" height="'+r1(Math.max(1.5,bot-yy))+'" rx="'+r1(Math.min(4,bw/2))+'" class="'+(metOk(m,p.v)?'b1':'b0')+'"><title>'+p.k+': '+fmtM(m,p.v)+'</title></rect>'});
  else{
    const pts=s.map((p,i)=>p.v==null?null:r1(x(i))+','+r1(y(p.v))).filter(Boolean);
    if(pts.length>1)g+='<polyline points="'+pts.join(' ')+'" class="ln"/>';
    s.forEach((p,i)=>{if(p.v!=null)g+='<circle cx="'+r1(x(i))+'" cy="'+r1(y(p.v))+'" r="'+(n>7?2.5:3.5)+'" class="dt"><title>'+p.k+': '+fmtM(m,p.v)+'</title></circle>'});
  }
  s.forEach((p,i)=>{if(n<=7||(n-1-i)%7===0)g+='<text x="'+r1(x(i))+'" y="'+(H0-6)+'" class="xl"'+(n>7&&i===n-1?' style="text-anchor:end"':'')+'>'+(n<=7?wdName(new Date(p.k+'T00:00:00').getDay()):(+p.k.slice(5,7))+'/'+(+p.k.slice(8)))+'</text>'});
  return '<svg class="ch" viewBox="0 0 '+W0+' '+H0+'" width="100%" role="img" aria-label="'+esc(t(MET.find(q=>q[0]===m)[1]))+'">'+g+'</svg>';
}
function wtHint(){
  const ws=Object.keys(S.days).filter(k=>parseFloat(S.days[k].wt)>0).sort().map(k=>({k:k,w:parseFloat(S.days[k].wt)}));
  if(ws.length<2)return t('h0');
  const last=ws[ws.length-1],ref=ws.filter(p=>(new Date(last.k)-new Date(p.k))/864e5>=10).pop();
  if(!ref)return t('h0');
  const r=(last.w-ref.w)/((new Date(last.k)-new Date(ref.k))/864e5)*7,rr=r.toFixed(2);
  return r<0.15?t('h1',{r:rr}):r>0.6?t('h2',{r:rr}):t('h3',{r:rr});
}

const STK=[['log','skLog'],['p','gP'],['h2o','gW'],['sp','gSp'],['pl','gPl']];
function dayOk(k,g){const r=S.days[k];if(!r)return false;const d=norm(r);return g==='log'?d.food.some(e=>!e.pend):goalHit(d)[g]}
function streak(g,today){
  today=today||ymd(new Date());
  const ok=k=>dayOk(k,g)&&isLive(k,S.days[k]);
  let c=0;for(let i=ok(today)?0:1;i<1000;i++){if(ok(shift(today,-i)))c++;else break}
  let best=c,run=0;const ks=Object.keys(S.days).filter(k=>k<=today).sort();
  if(ks.length)for(let k=ks[0];k<=today;k=shift(k,1)){if(ok(k)){run++;if(run>best)best=run}else run=0}
  let bf=0;for(let i=0;i<30;i++){const k=shift(today,-i);if(dayOk(k,g)&&!isLive(k,S.days[k]))bf++}
  return {cur:c,best:best,bf:bf};
}
function streakCard(){
  const rs=STK.map(x=>({x:x,r:streak(x[0])})),bf=rs[0].r.bf;
  return '<div class="c"><h2>'+t('skT')+'</h2>'+rs.map(o=>'<div class="li"><span>'+(o.r.cur?'🔥 ':'')+t(o.x[1])+'</span><span><b>'+o.r.cur+'</b> '+t('dys')+' <small class="mut">· '+t('skBest',{n:o.r.best})+'</small></span></div>').join('')

}
/* weekly report: Monday to Sunday */
function wkStats(ks){
  let fd=0,kc=0,pr=0,hw=0,hn=0,pt=0,px=0,gy=0,mn=0;const sl=[],md=[];
  ks.forEach(k=>{const r=S.days[k];if(!r)return;const d=norm(r);
    if(d.food.some(e=>!e.pend)){fd++;kc+=sum(d,'k');pr+=sum(d,'p')}
    if(d.h2o){hw+=d.h2o;hn++}if(d.plan){pt+=d.plan.length;px+=d.plan.filter(x=>x.x).length}
    const v=parseFloat(d.sl);if(v>0)sl.push(v);if(d.mood)md.push(d.mood);if(d.gym.length||d.wk.length)gy++;mn+=tot(d)});
  const av=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  return {kc:fd?kc/fd:null,p:fd?pr/fd:null,h2o:hn?hw/hn:null,pl:pt?px/pt*100:null,sl:av(sl),mood:av(md),gym:gy,min:mn};
}
function weekReport(mon){
  const td=ymd(new Date()),ks=[];for(let i=0;i<7;i++){const k=shift(mon,i);if(k<=td)ks.push(k)}
  const cnt={},of={},items={},rows=[];GOALS.forEach(g=>{cnt[g[0]]=0;of[g[0]]=0});
  ks.forEach(k=>{
    const r=S.days[k],d=r?norm(r):null,h=d?goalHit(d):{},open=k===td;let n=0;
    // today is not over: a goal not reached yet is not a miss
    GOALS.forEach(g=>{if(h[g[0]]){cnt[g[0]]++;n++}if(h[g[0]]||!open)of[g[0]]++});
    if(d&&d.plan)d.plan.forEach(x=>{if(open&&!x.x)return;const q=x.n,o=items[q]||(items[q]={n:x.n,z:x.z,of:0,miss:0});o.of++;if(!x.x)o.miss++});
    rows.push({k:k,n:n,h:h});
  });
  const miss=[];
  GOALS.forEach(g=>{const m=of[g[0]]-cnt[g[0]];if(m>0)miss.push({l:t(g[1]),m:m,n:of[g[0]]})});
  Object.keys(items).forEach(q=>{const o=items[q];if(o.of>=2&&o.miss>=2)miss.push({l:tx(o.n,o.z),m:o.miss,n:o.of})});
  miss.sort((a,b)=>b.m/b.n-a.m/a.n||b.m-a.m);
  const prev=ks.map(k=>shift(k,-7));
  return {mon:mon,ks:ks,rows:rows,cnt:cnt,of:of,miss:miss.slice(0,2),full:rows.filter(r=>r.n===GOALS.length).map(r=>r.k),now:wkStats(ks),last:wkStats(prev),sum:ks.length?weekSummary(ks[ks.length-1]):null};
}

// The report as a PNG, drawn on a canvas, so it can go to Photos or a chat.
async function rpImage(mon){
  const cv=document.createElement('canvas'),x=cv.getContext&&cv.getContext('2d');if(!x)return false;
  const W0=1080,P=72,F='-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",sans-serif';
  const font=i=>(i===0?'700 54px ':'400 36px ')+F,out=[];

    x.font=font(i);let cur2='';
    (l.match(/[　-鿿＀-￯]|[^\s　-鿿＀-￯]+\s*|\s+/g)||['']).forEach(tk=>{if(cur2&&!/^[，。、；：！？）》」』]/.test(tk)&&x.measureText(cur2+tk).width>W0-2*P){out.push([i,cur2]);cur2=tk.trimStart()}else cur2+=tk});
    out.push([i,cur2]);
  });

/* ---------- one-line meal entry: "2 eggs, chicken rice, kopi" or "两个鸡蛋，一碗米饭" ---------- */
const NUM={'一':1,'二':2,'两':2,'俩':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10,'半':.5,a:1,an:1,one:1,two:2,three:3,four:4,five:5,six:6,half:.5};
const UA={g:'g',gram:'g',grams:'g','克':'g',ml:'g','毫升':'g',kg:'kg','公斤':'kg',bowl:'bowl',bowls:'bowl','碗':'bowl',cup:'cup',cups:'cup','杯':'cup',glass:'cup',glasses:'cup',slice:'slice',slices:'slice','片':'slice',piece:'piece',pieces:'piece',pc:'piece',pcs:'piece','个':'piece','只':'piece','块':'piece','颗':'piece','根':'piece',tbsp:'tbsp','勺':'tbsp',scoop:'scoop',scoops:'scoop',serving:'serving',servings:'serving','份':'serving',plate:'plate',plates:'plate','盘':'plate','碟':'plate',stick:'stick',sticks:'stick','串':'stick',roll:'roll',rolls:'roll','条':'roll',bun:'bun',buns:'bun'};
const UG={bowl:250,cup:250,slice:30,piece:50,tbsp:15,scoop:30,serving:100,plate:350,stick:15,roll:130,bun:80};
const UK=Object.keys(UA).sort((a,b)=>b.length-a.length).join('|');
const QRE=new RegExp('^(\\d+(?:\\.\\d+)?|[一二两俩三四五六七八九十半]{1,2}|an?|one|two|three|four|five|six|half)\\s*(?:x\\s*)?('+UK+')?(?![a-z])\\s*(?:of\\s+|的)?');
const TRE=new RegExp('\\s*(?:[x×*]\\s*)?(\\d+(?:\\.\\d+)?|[一二两俩三四五六七八九十半]{1,2})\\s*('+UK+')?$');
const isZh=s=>/[一-鿿]/.test(s);
const cnum=s=>{if(/^\d/.test(s))return +s;if(NUM[s]!=null)return NUM[s];if(s.length===2&&s[0]==='十')return 10+(NUM[s[1]]||0);if(s.length===2&&s[1]==='十')return (NUM[s[0]]||1)*10;return null};
const sing=w=>w.length>4&&/ies$/.test(w)?w.slice(0,-3)+'y':w.length>4&&/(ches|shes|oes)$/.test(w)?w.slice(0,-2):w.length>3&&/s$/.test(w)&&!/ss$/.test(w)?w.slice(0,-1):w;
const words=s=>s.toLowerCase().split(/[^a-z0-9一-鿿]+/).filter(Boolean);
const POOL=()=>S.foods.map(x=>Object.assign({por:1},x)).concat(DB,S.dbx,PRE.map(x=>Object.assign({por:1},x)));
function findFood(n){
  n=n.trim().toLowerCase();if(!n)return {x:null,s:0};
  const ws=words(n).map(sing),nn=ws.join(' '),zh=isZh(n);let best=null,bs=0;
  POOL().forEach(x=>{
    const b=(x.b||x.n||'').toLowerCase(),keys=[b].concat((x.al||x.z||'').toLowerCase().split(' ')).filter(Boolean),hw=words(b+' '+(x.al||'')+' '+(x.z||''));
    let s=0;
    keys.forEach(k=>{
      if(k===n||k===nn||words(k).map(sing).join(' ')===nn)s=Math.max(s,100);
      else if(zh&&k.indexOf(n)>=0)s=Math.max(s,60+n.length*2-(k.length-n.length));
      else if(zh&&isZh(k)&&k.length>=2&&n.indexOf(k)>=0)s=Math.max(s,40+k.length*3);
    });
    if(s<100&&!zh&&ws.length&&ws.every(w=>hw.some(h=>h===w||sing(h)===w||(w.length>=3&&h.indexOf(w)===0))))
      s=Math.max(s,70-Math.max(0,words(b).length-ws.length)*3+(b.indexOf(ws[0])===0?10:0));
    if(s>bs){bs=s;best=x}
  });
  return {x:best,s:bs};
}
function parseItem(src){
  let s=src.trim().toLowerCase().replace(/\s+/g,' '),q=null,u=null,m;
  if(!s)return null;
  m=s.match(/^(\d+(?:\.\d+)?)\s*(kcal|cal|千卡|大卡|卡)\s*(.*)$/);
  if(m)return {src:src,e:{b:m[3]||'Quick add',z:m[3]?'':'快速添加',k:Math.round(+m[1]),p:0,f:0,c:0}};
  m=s.match(QRE);
  if(m&&(m[2]||!isZh(m[1]))&&m[0].length<s.length){q=cnum(m[1]);u=m[2]?UA[m[2]]:null;s=s.slice(m[0].length).trim()}
  else{m=s.match(TRE);if(m&&m.index>0&&(m[2]||/^\d/.test(m[1])||/[x×*]/.test(m[0]))){q=cnum(m[1]);u=m[2]?UA[m[2]]:null;s=s.slice(0,m.index).trim()}}
  const r=findFood(s),x=r.x;
  if(!x)return {src:src,e:null,s:0};
  let e;
  if(x.por){const n=q||1;e={b:x.b||x.n,z:x.z||'',k:Math.round(x.k*n),p:Math.round((x.p||0)*n*10)/10,f:Math.round((x.f||0)*n*10)/10,c:Math.round((x.c||0)*n*10)/10}}
  else{
    const one=S.gm[x.b]||(x.u?x.u[1]:100);let g;
    if(u==='g')g=q;else if(u==='kg')g=q*1000;
    else if(u)g=(q==null?1:q)*(x.u&&(x.u[0]===u||u==='piece'||u==='serving'||!UG[u])?x.u[1]:UG[u]);
    else if(q!=null)g=q>=20?q:q*one;else g=one;
    g=Math.round(g);const rr=g/100,f1=v=>Math.round(v*rr*10)/10;
    e={b:x.b,z:x.z||'',g:g,k:Math.round(x.k*rr),p:f1(x.p),f:f1(x.f),c:f1(x.c)};
  }
  return {src:src,e:e,s:r.s,q:q,u:u,x:x};
}
function parseLine(line){
  const out=[];
  line.split(/[,，、;；\n+＋]|和|\bthen\b/).forEach(ch=>{
    if(!ch.trim())return;
    let r=parseItem(ch);
    if(r&&!(r.e&&r.s>=70)&&/ and /i.test(ch)){const parts=ch.split(/ and /i).map(parseItem);if(parts.every(p=>p&&p.e))return parts.forEach(p=>out.push(p))}
    if(r)out.push(r);
  });
  return out;
}
let lp=[];
function lineBox(q){
  lp=parseLine(q);
  const ok=lp.filter(r=>r.e);
  if(!ok.length||(lp.length===1&&lp[0].q==null&&lp[0].x&&lp[0].s<70)){lp=[];return ''}
  const tk=ok.reduce((a,r)=>a+r.e.k,0);
  return '<div class="hl" style="padding:10px;border-radius:8px;margin-bottom:8px">'+lp.map(r=>r.e?'<div class="li"><span>'+esc(nm(r.e))+(r.e.g?' · '+r.e.g+'g':'')+'</span><span>'+r.e.k+' '+t('kc')+(r.e.p?', '+r.e.p+'g':'')+'</span></div>':'<div class="li mut"><span>'+esc(r.src.trim())+'</span><span>'+t('noMatch')+'</span></div>').join('')+'<div class="row"><button class="on" data-a="ladd">'+t('addAll',{n:tk})+'</button><small>'+t('lineHint')+'</small></div></div>';
}
function addLine(d){
  const ok=lp.filter(r=>r.e);if(!ok.length)return false;
  const it=ok.map(r=>Object.assign({},r.e));
  it.forEach(e=>addFood(d,Object.assign({},e)));
  ok.forEach(r=>{if(r.u==='g'&&r.x&&!r.x.por)S.gm[r.x.b]=r.e.g});
  remember(it);lp=[];return true;
}
function remember(it){
  if(it.length<2)return;
  const key=it.map(e=>e.b+':'+(e.g||e.k)).join('|'),i=S.meals.findIndex(m=>m.key===key);
  const m=i>=0?S.meals.splice(i,1)[0]:{key:key,it:it,n:0};
  m.n++;m.t=Date.now();S.meals.unshift(m);S.meals=S.meals.slice(0,12);touchCfg();

let ph={st:''},phFile=null,phRep=-1,phTok=0;
async function shrink(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
    const s=Math.min(1,1280/Math.max(img.naturalWidth,img.naturalHeight)),cv=document.createElement('canvas');
    cv.width=Math.round(img.naturalWidth*s);cv.height=Math.round(img.naturalHeight*s);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    return cv.toDataURL('image/jpeg',.82);
  }finally{URL.revokeObjectURL(url)}
}
async function sendPhoto(file){
  try{
    const data=await shrink(file);return sendPhotoData(data,file);
  }catch(e){ph={st:'err',msg:t('phErr')};render()}
}

/* Free route: the user asks any AI app (豆包, Claude, ChatGPT) with aiPrompt and pastes the reply.
   Rows look like "名称 | 克数 | 热量 | 蛋白质 | 脂肪 | 碳水"; pasting into a one-line input joins the rows,
   so rows are found by pattern rather than by line. */
const NUMF='\\s*(\\d+(?:\\.\\d+)?)\\s*(?:g|ml|kcal|克|毫升|千卡|大卡)?\\s*';
const PIPE=new RegExp('([^|｜\\n]*?)\\s*[|｜]'+NUMF+'[|｜]'+NUMF+'[|｜]'+NUMF+'[|｜]'+NUMF+'[|｜]'+NUMF,'g');
function parsePipe(txt){
  const out=[];let m;PIPE.lastIndex=0;
  while((m=PIPE.exec(String(txt||'')))){
    const n=m[1].replace(/^\s*(?:碳水(?:化合物)?\s*(?:[（(]?\s*(?:克|g)\s*[)）]?)?|carb(?:ohydrate)?s?\s*(?:[(]?\s*g\s*[)]?)?)\s+/i,'').replace(/^[\s\-*•·、,，;；]+|^\d+[.、)）]\s*/g,'').trim(),v=m.slice(2,7).map(Number);
    if(!n||!(v[0]>0))continue;
    const o={g:Math.round(v[0]),k:Math.round(v[1]),p:v[2],f:v[3],c:v[4]};
    out.push({b:n,z:isZh(n)?n:'',g:o.g,k:o.k,p:o.p,f:o.f,c:o.c,o:o});
  }
  return out.slice(0,12);
}
function aiLoad(txt){const it=parsePipe(txt);if(!it.length)return false;ph={st:'done',img:'',note:t('aiNote'),it:it};return true}
async function aiCopy(){
  let ok=false;try{await navigator.clipboard.writeText(t('aiPrompt'));ok=true}catch(e){}
  ph={st:'ai',msg:ok?t('aiCopied'):t('aiManual'),show:!ok};render();
}
async function aiPaste(){
  let txt='';try{txt=await navigator.clipboard.readText()}catch(e){}
  if(!aiLoad(txt))ph={st:'ai',msg:txt?t('aiBad'):t('aiPasteHint'),show:ph.show};
  render();
}

  const a=b.dataset.a,d=day(),ev0=evMap(d,cur);
  if(a==='auth'){doAuth();return}
  else if(a==='amode'){authMode=authMode==='in'?'up':'in';authMsg='';render();return}
  else if(a==='skip'){skip=true;pref('mode','local');loadSlot(KEY+':local');render();return}
  else if(a==='tosync'){skip=false;pref('mode',null);S=fresh();S.lang=pref('lang')||'zh';SK=null;render();return}
  else if(a==='forgot'){forgot();return}
  else if(a==='setpw'){setPw();return}
  else if(a==='signout'){signOut();return}
  else if(a==='reload'){persist();location.reload();return}
  else if(a==='tab'){tab=b.dataset.t;sel=null;qp=-1;focusFs=(tab==='food')}
  else if(a==='prev'){cur=shift(cur,-1)}
  else if(a==='next'){cur=shift(cur,1)}
  else if(a==='today'){cur=ymd(new Date())}
  else if(a==='lang'){S.lang=L()?'en':'zh';pref('lang',S.lang);touchCfg()}
  else if(a==='shelf'){const x=shl[+b.dataset.i];if(x)addFood(d,Object.assign({},x))}
  else if(a==='pick'){sel=fq[+b.dataset.i];showSel();return}
  else if(a==='unit'){const g=$('#fg');g.value=(parseFloat(g.value)||0)+sel.u[1];updPrev();return}
  else if(a==='fadd'){
    if(!sel)return;const x=calc();if(x.g<=0)return;
    addFood(d,{b:sel.b,z:sel.z||'',g:x.g,k:x.k,p:x.p,f:x.f,c:x.c});
    S.gm[sel.b]=x.g;
    if(sel.est&&!S.dbx.some(y=>y.b===sel.b))S.dbx.push({b:sel.b,z:'',al:'',k:sel.k,p:sel.p,f:sel.f,c:sel.c,u:null});
    touchCfg();sel=null;
  }
  else if(a==='fask'){ask();return}
  else if(a==='ladd'){if(!addLine(d))return;sel=null;focusFs=true}
  else if(a==='photo'){const f=$('#phf');if(f){f.value='';f.click()}return}
  else if(a==='phx'){ph={st:''};phFile=null;phRep=-1;phTok++;render();return}
  else if(a==='phretry'){if(phFile)sendPhoto(phFile);return}
  else if(a==='aicopy'){aiCopy();return}
  else if(a==='aipaste'){aiPaste();return}
  else if(a==='phdel'){if(ph.it){ph.it.splice(+b.dataset.i,1);if(!ph.it.length)ph={st:''}}render();return}
  else if(a==='phadd'){if(!ph.it||!ph.it.length)return;const it=ph.it.map(x=>({b:x.b,z:x.z,g:x.g,k:x.k,p:x.p,f:x.f,c:x.c}));
    if(phRep!==-1){const pi=d.food.findIndex(e=>e.pend&&(e.at||-1)===phRep);if(pi>=0){const at0=d.food[pi].at;d.food.splice(pi,1);it.forEach(e=>{if(at0)e.at=at0;d.food.push(Object.assign({},e))});remember(it);ph={st:''};phRep=-1;linkPlan(d,cur,ev0);save();render();return}}it.forEach(e=>addFood(d,Object.assign({},e)));remember(it);ph={st:''}}
  else if(a==='meal'){const m=S.meals.find(x=>x.key===b.dataset.k);if(!m)return;m.it.forEach(e=>addFood(d,Object.assign({},e)));m.n++;m.t=Date.now();touchCfg()}
  else if(a==='kadd'){const kk=parseInt($('#qk').value,10);if(!(kk>0))return;addFood(d,{b:'Quick add',z:'快速添加',k:kk,p:0,f:0,c:0})}
  else if(a==='cadd'){
    const n=$('#cn').value.trim(),kk=parseInt($('#ck').value,10),pp=parseFloat($('#cp').value)||0,ff=parseFloat($('#cf').value)||0,cc=parseFloat($('#cc').value)||0;
    if(!n||!(kk>0))return;
    const e1={b:n,z:'',k:kk,p:pp,f:ff,c:cc};addFood(d,Object.assign({},e1));
    const j=S.foods.findIndex(x=>(x.b||x.n)===n);if(j<0)S.foods.push(e1);else S.foods[j]=e1;touchCfg();
  }
  else if(a==='ycopy'){const py=S.days[shift(cur,-1)];if(!py||!py.food||!py.food.length)return;py.food.forEach(x=>addFood(d,Object.assign({},x)))}
  else if(a==='fav'){const e=d.food[+b.dataset.i];if(!e)return;if(isFav(e)){S.favs=S.favs.filter(f=>favKey(f)!==favKey(e));toast(t('favOff'))}else{S.favs=[clean(e)].concat(S.favs).slice(0,24);toast(t('favOn'))}touchCfg()}
  else if(a==='del'){const v=d.food.splice(+b.dataset.i,1)[0];if(v){const e=trash('food',cur,v);toast(t('deleted'),{label:t('undo'),fn:()=>binRestore(e)})}}
  else if(a==='gym'){const g=b.dataset.g,i=d.gym.indexOf(g);if(i<0)d.gym.push(g);else d.gym.splice(i,1)}
  else if(a==='min'){const c=b.dataset.c;d.min[c]=Math.max(0,d.min[c]+parseInt(b.dataset.v,10))}
  else if(a==='tmgo'){if(S.timer)return;S.timer={c:$('#tc').value,st:Date.now(),acc:0,k:cur,note:''}}
  else if(a==='tmpause'){const x=S.timer;if(!x)return;if(x.st){x.acc+=Date.now()-x.st;x.st=0}else x.st=Date.now()}
  else if(a==='tmstop'){tmStop()}
  else if(a==='toastact'){const f=toastAct;toastAct=null;toastMsg='';const el=$('#toast');if(el&&el.classList)el.classList.remove('show');if(f&&f.fn)f.fn();save();render();return}
  else if(a==='binres'){const b2=S.bin.filter(x=>Date.now()-x.at<7*864e5)[+b.dataset.i];if(b2&&binRestore(b2))toast(t('restored'))}
  else if(a==='pcopy'){const py=S.days[shift(cur,-1)];if(!py||!py.plan||!py.plan.length){toast(t('noYPlan'));return}if(!replacePlan(d,py.plan.map(x=>({t:x.t,n:x.n,z:x.z,x:false}))))return;toast(t('planCopied'))}
  else if(a==='papply'){const it=tplItems($('#tps').value);if(!it||!replacePlan(d,it))return;toast(t('tplApplied'))}
  else if(a==='psave'){let nmT=typeof prompt==='function'?prompt(t('tplName'),''):'';nmT=(nmT||'').trim()||(t('tplMine')+' '+(Object.keys(S.tpls).length+1));S.tpls=Object.assign({},S.tpls,{[nmT]:plan(d,cur).map(x=>({t:x.t,n:x.n,z:x.z}))});touchCfg();toast(t('tplSaved',{n:nmT}))}
  else if(a==='remon'){enablePush();return}
  else if(a==='remoff'){disablePush();return}
  else if(a==='remtest'){testPush();return}
  else if(a==='remcat'){const c=b.dataset.c,r=remOn();S.rem=Object.assign({},S.rem,{[c]:!r[c]});touchCfg()}
  else if(a==='calpre'){S.rem=Object.assign({},S.rem,{calPre:b.checked});touchCfg()}
  else if(a==='calsub'){calSub();return}
  else if(a==='calnew'){if(typeof confirm==='function'&&!confirm(t('remCalNewQ')))return;calToken(true);toast(t('remCalNewOk'))}
  else if(a==='calcopy'){if(!user){toast(t('remLogin'));return}const u='webcal://'+calUrl();try{navigator.clipboard.writeText(u);toast(t('copied'))}catch(z){toast(u)}save();return}
  else if(a==='gstep'){const g=$('#fg');if(!g)return;g.value=Math.max(1,(parseFloat(g.value)||0)+(+b.dataset.v));updPrev();return}
  else if(a==='pgstep'){const x=ph.it&&ph.it[+b.dataset.i];if(x)phScale(x,Math.max(1,x.g+(+b.dataset.v)));render();return}
  else if(a==='phsave'){phSavePending(d);return}
  else if(a==='pfill'){const e=d.food[+b.dataset.i];if(e&&e.img){phRep=e.at||-1;sendPhotoData(e.img)}return}
  else if(a==='pkc'){const e=d.food[+b.dataset.i];if(!e)return;const v=parseInt(typeof prompt==='function'?prompt(t('pendKcal'),''):'',10);if(!(v>0))return;e.k=v;delete e.pend}
  else if(a==='exadd'){const i=+$('#ea').value,m=parseFloat($('#em').value);if(!(m>0))return;d.ex.push({a:i,m:m,k:Math.round(ACT[i][2]*W()*m/60)})}
  else if(a==='exdel'){const v=d.ex.splice(+b.dataset.i,1)[0];if(v){const e=trash('ex',cur,v);toast(t('deleted'),{label:t('undo'),fn:()=>binRestore(e)})}}
  else if(a==='wadd'){const v=$('#wx').value.trim();if(!v)return;const e=exF(v),x=e?e[0]:v;if(!d.wk.some(w=>w.x===x))d.wk.push({x:x,s:[]});if(e&&d.gym.indexOf(e[2])<0)d.gym.push(e[2])}
  else if(a==='wdel'){const v=d.wk.splice(+b.dataset.i,1)[0];if(v){const e=trash('wk',cur,v);toast(t('deleted'),{label:t('undo'),fn:()=>binRestore(e)})}}
  else if(a==='wset'){const i=+b.dataset.i,w=d.wk[i],r=parseInt($('#wr'+i).value,10),kg=parseFloat($('#wg'+i).value)||0;if(!w||!(r>0))return;w.s.push({r:r,kg:kg})}
  else if(a==='wundo'){const w=d.wk[+b.dataset.i];if(w)w.s.pop()}
  else if(a==='padd'){const nn=$('#pn').value.trim();if(!nn)return;plan(d,cur).push({t:$('#pt').value||'12:00',n:nn,z:'',x:false})}
  else if(a==='pdel'){const v=plan(d,cur).splice(+b.dataset.i,1)[0];qp=-1;if(v){const e=trash('plan',cur,v);toast(t('deleted'),{label:t('undo'),fn:()=>binRestore(e)})}}
  else if(a==='pdone'){const i=+b.dataset.i,x=plan(d,cur)[i];x.x=b.checked;delete x.auto;const ks=kindsOf(x);if(ks.indexOf('eng')>=0)d.eng=b.checked;const ev=itemEv(d,cur,x);qp=b.checked&&ev&&!ev.ok?i:-1}
  else if(a==='qpx'){qp=-1}
  else if(a==='gonote'){qp=-1;render();const w=$('#win');if(w&&w.focus){w.scrollIntoView&&w.scrollIntoView({block:'center'});w.focus()}return}
  else if(a==='tadd'){ensureTpl().push(['0123456','12:00',L()?'':t('tplNew'),L()?t('tplNew'):'']);touchCfg()}
  else if(a==='tdel'){ensureTpl().splice(+b.dataset.i,1);touchCfg()}
  else if(a==='twd'){const x=ensureTpl()[+b.dataset.i],w=b.dataset.w;if(!x)return;x[0]=x[0].indexOf(w)>=0?x[0].replace(w,''):x[0]+w;touchCfg()}
  else if(a==='tdef'){S.tpl=null;touchCfg()}
  else if(a==='treset'){delete d.plan;plan(d,cur);save();render();const m=$('#tmsg');if(m)m.textContent=t('tplOk');return}
  else if(a==='mood'||a==='nrg'){const v=+b.dataset.v;d[a]=d[a]===v?0:v}
  else if(a==='h2o'){d.h2o=Math.max(0,(d.h2o||0)+(+b.dataset.v))}
  else if(a==='eng'){d.eng=b.checked}
  else if(a==='sp'){const id=b.dataset.id;d.sp[id]=!d.sp[id];if(!d.sp[id])delete d.sp[id];supSync(d)}
  else if(a==='spall'){SUPS.filter(s=>s[1]===b.dataset.g).forEach(s=>{d.sp[s[0]]=true});supSync(d)}
  else if(a==='csv'){dlCSV();return}
  else if(a==='aduse'){const v=+b.dataset.v;if(!(v>0))return;S.t.k=v;touchCfg();save();render();const m=$('#adm');if(m)m.textContent=t('adOk');return}
  else if(a==='trm'){trM=b.dataset.m;pref('trm',trM);render();return}
  else if(a==='trr'){trR=+b.dataset.v;pref('trr',String(trR));render();return}
  else if(a==='rpw'){rpW=Math.min(0,rpW+(+b.dataset.v));render();return}
  else if(a==='rpshare'||a==='rpcopy'){rpSend(a==='rpshare');return}
  else if(a==='rpimg'){rpImage(shift(monday(cur),7*rpW));return}
  else if(a==='seen'){S.seen=VER;persist();render();return}
  else if(a==='bshow'){$('#bk').value=JSON.stringify(S);$('#bm').textContent=t('bok');return}
  else if(a==='bcopy'){const x=$('#bk');x.select();let ok=false;try{ok=document.execCommand('copy')}catch(z){}try{navigator.clipboard.writeText(x.value)}catch(z){}$('#bm').textContent=ok?t('bcp'):t('bman');return}
  else if(a==='brest'){const r=restoreFrom($('#bk').value);if(r===null)return;if(r)render();const m=$('#bm');if(m)m.textContent=r?t('brok'):t('bbad');return}
  else if(a==='bfile'){saveFile('daily-life-log-backup-'+ymd(new Date())+'.json',JSON.stringify(S),'application/json');$('#bm').textContent=t('bfok');return}
  else if(a==='bpick'){const f=$('#bfi');if(f){f.value='';f.click()}return}
  linkPlan(d,cur,ev0);
  save();render();
});
document.addEventListener('input',e=>{
  const id=e.target.id,d=day();
  if(id==='win')d.win=e.target.value;
  else if(id==='nx')d.next=e.target.value;
  else if(id==='wt')d.wt=e.target.value;
  else if(id==='sl')d.sl=e.target.value;
  else if(id==='tmn'){if(S.timer){S.timer.note=e.target.value;persist()}return}
  else if(id==='stp')d.stp=e.target.value;
  else if(id==='fs'){if(/[|｜]/.test(e.target.value)&&aiLoad(e.target.value)){render();return}showRes();return}
  else if(id==='fg'){updPrev();return}
  else if(id.indexOf('t_')===0){const v=parseFloat(e.target.value);if(!(v>0))return;S.t[id.slice(2)]=v;touchCfg()}
  else return;
  save();
});
document.addEventListener('change',e=>{
  if(e.target.id==='phf'){const f=e.target.files&&e.target.files[0];if(f)sendPhoto(f);return}
  if(e.target.id==='bfi'){const f=e.target.files&&e.target.files[0];if(f)f.text().then(txt=>{const r=restoreFrom(txt);if(r===null)return;if(r)render();const m=$('#bm');if(m)m.textContent=r?t('brok'):t('bbad')});return}
  // typing in the night note or weight saves as you go; link the plan once you leave the field
  if(['win','nx','wt'].indexOf(e.target.id)>=0){if(linkPlan(day(),cur,evSnap)){save();render()}return}
  if(e.target.dataset&&e.target.dataset.pg!=null){const x=ph.it&&ph.it[+e.target.dataset.pg],g=parseFloat(e.target.value);if(x&&g>0){phScale(x,Math.round(g));render()}return}
  const tp=e.target.dataset&&e.target.dataset.tp;if(!tp)return;
  const x=ensureTpl()[+e.target.dataset.i];if(!x)return;
  if(tp==='t')x[1]=e.target.value||'12:00';
  else{const v=e.target.value.trim();if(!v)return;x[2]=L()?'':v;x[3]=L()?v:''}
  touchCfg();save();
});
const typing=el=>el&&(el.tagName==='TEXTAREA'||(el.tagName==='INPUT'&&!/checkbox|radio|file|button/.test(el.type)));
document.addEventListener('focusin',e=>{if(!typing(e.target)||!document.body.classList)return;document.body.classList.add('kb');const el=e.target;setTimeout(()=>{if(el.scrollIntoView)el.scrollIntoView({block:'center',behavior:'smooth'})},320)});
document.addEventListener('focusout',()=>{setTimeout(()=>{if(document.body.classList&&!typing(document.activeElement))document.body.classList.remove('kb')},120)});
document.addEventListener('toggle',e=>{if(e.target.id==='tplc')tplOpen=e.target.open},true);
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.isComposing)return;
  if(e.target.id==='wx'){e.preventDefault();const b=document.querySelector('[data-a=wadd]');if(b)b.click();return}
  if(e.target.id!=='fs')return;
  e.preventDefault();
  if(addLine(day())){sel=null;focusFs=true;save();render()}
  else if(fq.length===1){sel=fq[0];showSel()}
});
try{const qt=new URLSearchParams(location.search||'').get('tab');if(qt&&['food','today','act','rev'].indexOf(qt)>=0)tab=qt}catch(e){}
initSync();
render();
</script>
</body>
</html>
