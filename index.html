S.lang=pref('lang')||'zh';
function persist(){if(!SK)return;try{localStorage.setItem(SK,JSON.stringify(S))}catch(e){}}
function loadSlot(k){
  let o=null;
  try{const r=localStorage.getItem(k);if(r)o=JSON.parse(r)}catch(e){}
  if(!o){try{const lg=localStorage.getItem(KEY);if(lg){o=JSON.parse(lg);localStorage.setItem(KEY+':legacy',lg);localStorage.removeItem(KEY)}}catch(e){}}

}

newH:['Apple Health: an iPhone Shortcut can send steps, sleep and active energy every night, so you no longer type them (Review → Apple Health has the steps).','Apple 健康：用 iPhone 的“快捷指令”每晚自动发送步数、睡眠和活动消耗，不用再手填（设置步骤在复盘页 → Apple 健康）。'],
newM:['Plan times: tap a time to change it, or move every open item by ±15 / 30 / 60 minutes at once. Same-time items are pointed out. Changing a weekly template item also updates the open item on today’s plan.','计划时间：点时间就能改，也可以把没完成的一次性推后或提前 15 / 30 / 60 分钟；时间撞了会提示。改每周模板里的事项时，今天计划里没完成的同一项也会跟着改。'],

hlS1:['Tap “Copy the sync link” above.','点上面的「复制同步链接」。'],
hlS2:['Open the Shortcuts app, tap +, and name it “Sync Log”.','打开「快捷指令」(Shortcuts) App，点右上角 ＋，把名字改成「同步日志」。'],
hlS3:['Steps: add “Find Health Samples”, set Type to Steps, then Add Filter → Start Date is today. Add “Calculate Statistics” and set it to Sum.','步数：添加「查找健康样本」(Find Health Samples)，类型 (Type) 选「步数」(Steps)，点「添加过滤条件」(Add Filter) → 开始日期 (Start Date) 是今天 (is today)。再添加「计算统计数据」(Calculate Statistics)，设为「总和」(Sum)。'],
hlS4:['Add “Get Contents of URL” and paste the link into it. Move the cursor right after steps= (hold the space bar to move it like a trackpad), then tap the Statistics Result variable above the keyboard. Leave the method as GET.','添加「获取 URL 内容」(Get Contents of URL)，把链接粘贴进去。把光标移到 steps= 后面（长按空格键可以像触控板一样移动光标），再点键盘上方的变量「统计结果」(Statistics Result)。方法保持 GET。'],
hlS5:['Tap ▶ to run it and allow access. Come back here: “Last received” shows today’s steps. Steps alone are enough; step 6 is optional.','点 ▶ 运行，弹出的权限都点「允许」(Allow)。回到这里，「上次收到」会显示今天的步数。只同步步数就够了，第 6 步可选。'],
hlS6:['Optional, active energy: repeat step 3 with Type Active Energy and drag both new actions above “Get Contents of URL”. Put the cursor after active=, tap Select Variable, then tap that Calculate Statistics. Sleep works the same way (Sleep Analysis → Get Details of Health Samples: Duration → Sum), but only if Health records your sleep, which usually needs an Apple Watch at night. Without it, type sleep in by hand.','可选，活动消耗：照第 3 步再做一组，类型选「活动能量」(Active Energy)，把新加的两行拖到「获取 URL 内容」上面。光标放在 active= 后面，点「选择变量」(Select Variable)，再点这一组的「计算统计数据」。睡眠也是同样做法（「睡眠分析」Sleep Analysis →「获取健康样本的详细信息」选「时长」Duration → 总和），但要健康 App 里有睡眠记录才行，一般要戴 Apple Watch 睡觉；没有的话在「身心状态」里手动填就行。'],
hlS7:['Automation tab → + → Time of Day: 23:30, Daily → Run Immediately, turn off Notify When Run → choose “Sync Log”.','底部「自动化」(Automation) → ＋ →「特定时间」(Time of Day)：23:30，每天 (Daily) → 选「立即运行」(Run Immediately)，关掉「运行时通知」(Notify When Run) → 选「同步日志」。'],
hlSafe:['The link works like a password for these three numbers. If it leaks, make a new link.','这个链接相当于这几项数据的密码，别发给别人；泄露了就点「生成新链接」。'],

async function flush(){

      const sentT={};keys.forEach(k=>{sentT[k]=S.days[k]._t});
      const rows=keys.map(k=>({user_id:user.id,day:k,data:S.days[k],updated_at:new Date().toISOString()}));
      const r=await sb.from('days').upsert(rows,{onConflict:'user_id,day'});if(r.error)throw r.error;
      // _s = the version the server has; a day changed while uploading stays dirty
      keys.forEach(k=>{const d=S.days[k];if(!d)return;d._s=sentT[k];if(d._t===sentT[k])dirty.delete(k)});persist();
    }
    if(cfgDirty){
      const data={_t:S._ct};CFG.forEach(f=>{data[f]=S[f]});
      const r=await sb.from('cfg').upsert({user_id:user.id,data:data,updated_at:new Date().toISOString()},{onConflict:'user_id'});

// One day from the server against the local copy. _t = last change, _s = version last synced.
// Only one side changed → take it. Both changed since the last sync → merge (never overwrite silently).
const strip=d=>{const o=Object.assign({},d);delete o._t;delete o._s;return JSON.stringify(o)};
function syncDay(k,j){
  j=j||{};const l=S.days[k];
  if(!l){j._s=j._t;S.days[k]=j;return 'remote'}
  const lt=l._t||0,rt=j._t||0;
  if(lt===rt||strip(l)===strip(j)){l._s=rt;if(rt>lt)l._t=rt;return 'same'}
  const base=l._s!=null?l._s:Math.min(lt,rt),lc=lt>base,rc=rt>base;
  if(rc&&!lc){j._s=rt;S.days[k]=j;return 'remote'}
  if(lc&&!rc){dirty.add(k);return 'local'}
  const m=mergeDay(norm(Object.assign({},l)),norm(Object.assign({},j)),k);m._t=Date.now();m._s=rt;S.days[k]=m;dirty.add(k);return 'merged';
}
// a = this device, b = the other device. Lists are joined (records deleted into the bin stay deleted),
// ticks and habits are kept if either side has them, counters take the larger value, text keeps this device's.
function mergeDay(a,b,k){
  const gone=new Set(S.bin.filter(x=>x.d===k).map(x=>x.type+'|'+JSON.stringify(x.v)));
  const uni=(x,y,key,type)=>{const out=[],seen=new Set();(x||[]).concat(y||[]).forEach(e=>{const q=key(e);if(seen.has(q)||gone.has(type+'|'+JSON.stringify(e)))return;seen.add(q);out.push(e)});return out};
  const m=Object.assign({},b,a),pk=x=>x.t+'|'+x.n+'|'+x.z;
  m.food=uni(a.food,b.food,e=>(e.at||'')+'|'+(e.b||e.n)+'|'+e.k,'food');
  if(a.plan||b.plan){const bx=new Map((b.plan||[]).map(x=>[pk(x),x]));m.plan=uni(a.plan,b.plan,pk,'plan').map(x=>{const o=bx.get(pk(x));return o&&o.x&&!x.x?Object.assign({},x,{x:true}):x})}
  m.sp=Object.assign({},b.sp,a.sp);
  m.gym=Array.from(new Set(a.gym.concat(b.gym)));
  m.wk=uni(a.wk,b.wk,w=>w.x+'|'+JSON.stringify(w.s),'wk');
  m.ex=uni(a.ex,b.ex,x=>JSON.stringify(x),'ex');
  m.tl=uni(a.tl,b.tl,x=>String(x.at),'tl');
  m.min={};['study','lab','ai','career'].forEach(c=>{m.min[c]=Math.max(a.min[c]||0,b.min[c]||0)});
  m.eng=!!(a.eng||b.eng);if(a.lv||b.lv)m.lv=1;if(a.kd||b.kd)m.kd=Object.assign({},b.kd,a.kd);if(a.wr||b.wr)m.wr=1;m.h2o=Math.max(a.h2o||0,b.h2o||0);if(a.xd==null&&b.xd!=null)m.xd=b.xd;
  ['mood','nrg','sl','stp','wt','win','next'].forEach(f=>{m[f]=a[f]||b[f]||''});
  // values sent by Apple Health: the newer import wins over the other copy
  const hs=[a.hs,b.hs].filter(Boolean).sort((x,y)=>y.at-x.at)[0];
  if(hs){const src=hs===b.hs?b:a;(hs.f||[]).forEach(f=>{if(src[f]!=null)m[f]=src[f]});m.hs=hs}
  return m;
}
async function pull(){
  const dr=await sb.from('days').select('day,data').eq('user_id',user.id);
  const cr=await sb.from('cfg').select('data').eq('user_id',user.id).maybeSingle();
  if(dr.error)throw dr.error;
  const have=new Set();
  const merged=[];
  (dr.data||[]).forEach(r=>{have.add(r.day);if(syncDay(r.day,r.data)==='merged')merged.push(r.day.slice(5))});
  if(merged.length)toast(t('merged',{d:merged.join('、')}));
  Object.keys(S.days).forEach(k=>{if(!have.has(k))dirty.add(k)});
  const c=cr.data&&cr.data.data;
  if(c&&c._t){if(c._t>(S._ct||0)){const df=fresh();CFG.forEach(f=>{if(f==='lang'){if(c.lang)S.lang=c.lang}else S[f]=c[f]!=null?c[f]:df[f]});S._ct=c._t}else if(c._t<(S._ct||0))cfgDirty=true}
  else cfgDirty=true;

}

/* ---------- plan ↔ records (Phase 1) ----------
   A plan item's kinds come from its text, so old days and edited templates work without migration.
   The tick (x) is the single "done" state; records are evidence. A record added or removed by the user
   ticks / unticks the item (auto=true marks ticks made this way). Viewing a day never changes it. */
const KINDS=[['meal_b',/早餐|breakfast/i],['meal_s',/加餐|snack/i],['sup',/补剂|补充剂|supplement|鱼油|镁片|肌酸|维生素/i],['gym',/健身|\bgym\b|workout/i],
  ['eng',/口语|spoken english/i],['note',/睡前小结|night note/i],['weigh',/称重|weigh-in/i],['lab',/^实验(到|（|\(|$)|^lab\b/i],['ai',/AI ?项目|AI project/i]];
function kindsOf(x){
  const out=[];
  KINDS.forEach(k=>{if(k[1].test(x.n||'')||k[1].test(x.z||''))out.push(k[0]==='sup'?((x.t||'')<'15:00'?'sup_am':'sup_pm'):k[0])});
  return out;
}
const minOf=ms=>{const t0=new Date(ms);return t0.getHours()*60+t0.getMinutes()};
function ate(d,k,a,b){
  const timed=d.food.filter(e=>e.at&&ymd(new Date(e.at))===k);
  if(timed.some(e=>{const m=minOf(e.at);return m>=a&&m<=b}))return {ok:true};
  return {ok:false,maybe:d.food.some(e=>!e.at)};
}
function kindEv(d,k,kind){
  if(kind==='meal_b')return ate(d,k,0,690);       // until 11:30
  if(kind==='meal_s')return ate(d,k,840,1080);    // 14:00 to 18:00
  if(kind==='sup_am'||kind==='sup_pm'){const g=kind.slice(4),it=SUPS.filter(s=>s[1]===g),n=it.filter(s=>d.sp[s[0]]).length;return {ok:n===it.length,part:n?n+'/'+it.length:''}}
  if(kind==='gym')return {ok:d.gym.length>0||d.wk.some(w=>w.s.length)};
  if(kind==='eng')return {ok:!!d.eng};
  if(kind==='note')return {ok:!!((d.win||'').trim()||(d.next||'').trim())};
  if(kind==='weigh')return {ok:parseFloat(d.wt)>0};
  if(kind==='lab')return {ok:d.min.lab>0};
  if(kind==='ai')return {ok:d.min.ai>0};

}
function itemEv(d,k,x){
  const ks=kindsOf(x);if(!ks.length)return null;
  const r=ks.map(kd=>kindEv(d,k,kd));
  return {ks:ks,ok:r.every(e=>e.ok),maybe:r.some(e=>e.maybe)&&!r.every(e=>e.ok),part:(r.find(e=>e.part&&!e.ok)||{}).part||''};
}

const evMap=(d,k)=>{const m=new Map();plan(d,k).forEach(x=>{const e=itemEv(d,k,x);m.set(x,!!(e&&e.ok))});return m};

   The server (api/push-tick.js, api/calendar.js) reads S.sched / S.stat / S.rem / S.tz from the cfg row.

const VAPID_PUB='BErwRNr7p821FnB-t8b44r2Q8An1gz31nI6EVlmYYR9SgEgBPtE4RIYylGbIlmL36hj31xS5DA0ngGRwZs764Ak';

// Move every open item (today: only the ones not yet past) by m minutes; returns the old times for Undo.

function planPreview(k){const d=S.days[k];if(d&&d.plan)return d.plan;const wd=new Date(k+'T00:00:00').getDay();return tpl().filter(x=>x[0].indexOf(wd)>=0).map(x=>({t:x[1],n:x[2],z:x[3],x:false}))}

function shelf(){

function weekSummary(k){
  const T0=T(),mins={study:0,lab:0,ai:0,career:0},parts=new Set();
  let fd=0,kc=0,pr=0,pd=0,gy=0,en=0,pt=0,px=0,spl=0,spc=0;const sls=[],mds=[],vol={},ts={n:0};
  for(let i=0;i<7;i++){
    const raw=S.days[shift(k,-i)];if(!raw)continue;const d=norm(raw);
    if(parseFloat(d.sl)>0)sls.push(parseFloat(d.sl));if(d.mood)mds.push(d.mood);
    d.wk.forEach(w=>{const e=exF(w.x);if(e&&w.s.length){vol[e[2]]=(vol[e[2]]||0)+w.s.length;ts.n+=w.s.length}});
    if(d.food.length){fd++;kc+=sum(d,'k');const p=sum(d,'p');pr+=p;if(p>=T0.p)pd++}
    if(d.gym.length){gy++;d.gym.forEach(g=>parts.add(g))}
    if(d.eng)en++;
    if(Object.keys(d.sp).length||d.supp){spl++;if(d.supp)spc++}
    for(const c in mins)mins[c]+=d.min[c]||0;
    if(d.plan){pt+=d.plan.length;px+=d.plan.filter(x=>x.x).length}
  }
  const ak=fd?Math.round(kc/fd):0,ap=fd?Math.round(pr/fd):0;
  const wts=Object.keys(S.days).filter(x=>x<=k&&parseFloat(S.days[x].wt)>0).sort(),wk=shift(k,-7);
  const wa=wts.length?wts[wts.length-1]:null,wb=wts.filter(x=>x<=wk).pop();
  const wc=wa&&wb&&wa>wk?Math.round((parseFloat(S.days[wa].wt)-parseFloat(S.days[wb].wt))*10)/10:null;
  const sug=[];
  if(fd<5)sug.push(t('s_log',{n:fd}));
  if(fd>=3&&ak<T0.k-300)sug.push(t('s_low',{a:ak,d:T0.k-ak}));else if(fd>=3&&ak>T0.k+300)sug.push(t('s_high',{a:ak,d:ak-T0.k}));
  if(fd>=3&&pd<Math.ceil(fd*.7))sug.push(t('s_prot',{n:pd,m:fd}));
  const as=sls.length?Math.round(sls.reduce((a,b)=>a+b,0)/sls.length*10)/10:0,am=mds.length?Math.round(mds.reduce((a,b)=>a+b,0)/mds.length*10)/10:0;
  if(sls.length>=3&&as<7)sug.push(t('s_sleep',{a:as}));
  if(ts.n>=6){const low=['Legs','Chest','Back','Shoulders'].filter(p=>(vol[p]||0)<6);if(low.length)sug.push(t('s_vol',{p:GYM.filter(g=>low.indexOf(g[0])>=0).map(g=>g[L()]).join(L()?'、':', ')}))}
  if(gy<3)sug.push(t('s_gym',{n:gy}));else if(ts.n<6){const miss=GYM.filter(g=>!parts.has(g[0])&&g[0]!=='Abs');if(miss.length)sug.push(t('s_part',{p:miss.map(g=>g[L()]).join(L()?'、':', ')}))}
  if(spl>=3&&spc<spl)sug.push(t('s_sup',{n:spc,m:spl}));
  if(en<5)sug.push(t('s_eng',{n:en}));
  if(!mins.ai)sug.push(t('s_ai'));
  if(pt>=7&&px/pt<.5)sug.push(t('s_plan',{r:Math.round(px/pt*100)}));
  return {ak:ak,ap:ap,pd:pd,fd:fd,gy:gy,en:en,mins:mins,pt:pt,px:px,spl:spl,spc:spc,wc:wc,as:as,am:am,vol:vol,sug:sug.length?sug.slice(0,3):[t('s_ok')]};
}
function adaptive(k){
  let ki=0,fd=0;const ws=[];
  for(let i=0;i<28;i++){const d=S.days[shift(k,-i)];if(!d)continue;norm(d);if(d.food.length){fd++;ki+=sum(d,'k')}const w=parseFloat(d.wt);if(w>0)ws.push({x:-i,w:w})}
  const span=ws.length?Math.max.apply(null,ws.map(p=>p.x))-Math.min.apply(null,ws.map(p=>p.x)):0;
  if(fd<10||ws.length<2||span<10)return {ok:false,fd:fd,wn:ws.length};
  const n=ws.length,mx=ws.reduce((a,p)=>a+p.x,0)/n,my=ws.reduce((a,p)=>a+p.w,0)/n;
  const sl=ws.reduce((a,p)=>a+(p.x-mx)*(p.w-my),0)/ws.reduce((a,p)=>a+(p.x-mx)*(p.x-mx),0);
  const ai=ki/fd,burn=Math.round((ai-sl*7700)/10)*10;
  return {ok:true,fd:fd,wn:n,ai:Math.round(ai),rate:Math.round(sl*7*100)/100,burn:burn,target:Math.round((burn+275)/50)*50};
}

function patterns(k){
  const D=[];for(let i=0;i<60;i++){const r=S.days[shift(k,-i)];if(r)D.push(norm(r))}
  const avg=(a,r)=>{const v=a.reduce((x,y)=>x+y,0)/a.length;return r?Math.round(v):Math.round(v*10)/10},out=[];
  const cmp=(inA,val,lab,r)=>{const A=[],B=[];D.forEach(d=>{const g=inA(d),v=val(d);if(g==null||v==null)return;(g?A:B).push(v)});if(A.length>=5&&B.length>=5)out.push(t(lab,{a:avg(A,r),b:avg(B,r),n:A.length,m:B.length}))};
  const slp=d=>parseFloat(d.sl)>0?parseFloat(d.sl)>=7:null;
  cmp(slp,d=>d.mood||null,'p_sleep');
  cmp(slp,d=>tot(d)>0?tot(d):null,'p_work',1);
  cmp(d=>d.nrg?d.gym.length>0:null,d=>d.nrg||null,'p_gym');
  cmp(d=>parseInt(d.stp,10)>0?parseInt(d.stp,10)>=8000:null,d=>d.mood||null,'p_step');
  return out;
}

function toCSV(){
  const q=v=>{v=v==null?'':String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v},r1=v=>Math.round(v*10)/10;
  const H=['date','kcal','protein_g','fat_g','carbs_g','foods','gym','study_min','lab_min','ai_min','career_min','exercise_kcal','english','supplements','weight_kg','plan_done','plan_total','win','tomorrow','mood_1to5','energy_1to5','sleep_h','water_cups','steps','workout'];
  const rows=Object.keys(S.days).sort().map(k=>{
    const d=norm(S.days[k]),pl=d.plan||[];
    if(!(d.food.length||d.gym.length||tot(d)||d.ex.length||d.eng||d.supp||d.wt||d.win||d.next||pl.some(x=>x.x)||d.mood||d.nrg||d.sl||d.h2o||d.stp||d.wk.length))return null;
    return [k,Math.round(sum(d,'k')),r1(sum(d,'p')),r1(sum(d,'f')),r1(sum(d,'c')),d.food.map(e=>(e.b||e.n)+(e.g?' '+e.g+'g':'')).join(' | '),d.gym.join(' '),d.min.study,d.min.lab,d.min.ai,d.min.career,d.ex.reduce((a,x)=>a+x.k,0),d.eng?1:0,Object.keys(d.sp).filter(x=>d.sp[x]).join(' ')||(d.supp?1:0),d.wt,pl.filter(x=>x.x).length,pl.length,d.win,d.next,d.mood||'',d.nrg||'',d.sl||'',d.h2o||'',d.stp||'',d.wk.map(w=>w.x+' '+w.s.map(s=>s.r+'x'+s.kg).join(' ')).join(' | ')];
  }).filter(Boolean);
  return '﻿'+[H].concat(rows).map(r=>r.map(q).join(',')).join('\n')+'\n';
}

async function saveFile(name,text,type){
  const blob=text instanceof Blob?text:new Blob([text],{type:type+';charset=utf-8'});
  try{
    const f=new File([blob],name,{type:type});
    if(/iPhone|iPad|Android/i.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(u),5000);
}
// Restore merges by day: days in the backup replace the same days here; other days are kept.
function restoreFrom(txt){
  let o;try{o=JSON.parse(txt);if(!o||!o.days)throw 0}catch(x){return false}
  if(typeof confirm==='function'&&!confirm(t('bconf')))return null;
  const now=Date.now();Object.keys(o.days).forEach(k=>{S.days[k]=Object.assign({},o.days[k],{_t:now});dirty.add(k)});
  ['foods','dbx','t','gm','meals','tpl'].forEach(f=>{if(o[f]!=null)S[f]=o[f]});
  touchCfg();persist();schedule();return true;

function nmTarget(rk,rp,h){
  const m=h<11?['mlB',1/3]:h<15?['mlL',1/2]:h<17?['mlS',1/3]:['mlD',1];
  return {m:m[0],k:Math.min(rk*m[1]>=250?rk*m[1]:rk,1200),p:Math.max(0,rp*m[1])};

function nmIdeas(mk,mp,bf){
  const pool=[],seen=new Set(),add=e=>{if(!e||!(e.k>0)||e.k>1200||e.pend)return;const q=e.b||e.n;if(!q||seen.has(q)||(!bf&&/^breakfast/i.test(q)))return;seen.add(q);pool.push(e)};
  shelf().slice(0,8).forEach(e=>add(clean(e)));
  NMC.forEach(c=>{const x=DB.find(f=>f.b===c[0]);if(!x)return;const r=c[1]/100,o=v=>Math.round(v*r*10)/10;add({b:x.b,z:x.z,g:c[1],k:Math.round(x.k*r),p:o(x.p),f:o(x.f),c:o(x.c)})});
  const tot2=(cb,f)=>cb.reduce((a,e)=>a+(e[f]||0),0);
  const sc=cb=>{const k=tot2(cb,'k'),p=tot2(cb,'p');if(k>mk*1.15+40)return -1e9;return -2*Math.max(0,mp-p)/Math.max(mp,10)-Math.abs(k-mk)/Math.max(mk,200)};
  const cs=[];
  for(let i=0;i<pool.length;i++){cs.push([pool[i]]);for(let j=i+1;j<pool.length;j++)cs.push([pool[i],pool[j]])}
  const out=[],used=new Set();
  cs.map(cb=>({cb:cb,s:sc(cb)})).filter(x=>x.s>-1e9).sort((a,b)=>b.s-a.s).forEach(x=>{
    if(out.length>=3||x.cb.some(e=>used.has(e.b||e.n)))return;x.cb.forEach(e=>used.add(e.b||e.n));out.push(x.cb)});
  return out;
}

/* ---------- one-line meal entry: "2 eggs, chicken rice, kopi" or "两个鸡蛋，一碗米饭" ---------- */
const NUM={'一':1,'二':2,'两':2,'俩':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10,'半':.5,a:1,an:1,one:1,two:2,three:3,four:4,five:5,six:6,half:.5};
const UA={g:'g',gram:'g',grams:'g','克':'g',ml:'g','毫升':'g',kg:'kg','公斤':'kg',bowl:'bowl',bowls:'bowl','碗':'bowl',cup:'cup',cups:'cup','杯':'cup',glass:'cup',glasses:'cup',slice:'slice',slices:'slice','片':'slice',piece:'piece',pieces:'piece',pc:'piece',pcs:'piece','个':'piece','只':'piece','块':'piece','颗':'piece','根':'piece',tbsp:'tbsp','勺':'tbsp',scoop:'scoop',scoops:'scoop',serving:'serving',servings:'serving','份':'serving',plate:'plate',plates:'plate','盘':'plate','碟':'plate',stick:'stick',sticks:'stick','串':'stick',roll:'roll',rolls:'roll','条':'roll',bun:'bun',buns:'bun'};
const UG={bowl:250,cup:250,slice:30,piece:50,tbsp:15,scoop:30,serving:100,plate:350,stick:15,roll:130,bun:80};
const UK=Object.keys(UA).sort((a,b)=>b.length-a.length).join('|');
const QRE=new RegExp('^(\\d+(?:\\.\\d+)?|[一二两俩三四五六七八九十半]{1,2}|an?|one|two|three|four|five|six|half)\\s*(?:x\\s*)?('+UK+')?(?![a-z])\\s*(?:of\\s+|的)?');
const TRE=new RegExp('\\s*(?:[x×*]\\s*)?(\\d+(?:\\.\\d+)?|[一二两俩三四五六七八九十半]{1,2})\\s*('+UK+')?$');
const isZh=s=>/[一-鿿]/.test(s);
const cnum=s=>{if(/^\d/.test(s))return +s;if(NUM[s]!=null)return NUM[s];if(s.length===2&&s[0]==='十')return 10+(NUM[s[1]]||0);if(s.length===2&&s[1]==='十')return (NUM[s[0]]||1)*10;return null};
const sing=w=>w.length>4&&/ies$/.test(w)?w.slice(0,-3)+'y':w.length>4&&/(ches|shes|oes)$/.test(w)?w.slice(0,-2):w.length>3&&/s$/.test(w)&&!/ss$/.test(w)?w.slice(0,-1):w;
const words=s=>s.toLowerCase().split(/[^a-z0-9一-鿿]+/).filter(Boolean);
const POOL=()=>S.foods.map(x=>Object.assign({por:1},x)).concat(DB,S.dbx,PRE.map(x=>Object.assign({por:1},x)));
function findFood(n){
  n=n.trim().toLowerCase();if(!n)return {x:null,s:0};
  const ws=words(n).map(sing),nn=ws.join(' '),zh=isZh(n);let best=null,bs=0;
  POOL().forEach(x=>{
    const b=(x.b||x.n||'').toLowerCase(),keys=[b].concat((x.al||x.z||'').toLowerCase().split(' ')).filter(Boolean),hw=words(b+' '+(x.al||'')+' '+(x.z||''));
    let s=0;
    keys.forEach(k=>{
      if(k===n||k===nn||words(k).map(sing).join(' ')===nn)s=Math.max(s,100);
      else if(zh&&k.indexOf(n)>=0)s=Math.max(s,60+n.length*2-(k.length-n.length));
      else if(zh&&isZh(k)&&k.length>=2&&n.indexOf(k)>=0)s=Math.max(s,40+k.length*3);
    });
    if(s<100&&!zh&&ws.length&&ws.every(w=>hw.some(h=>h===w||sing(h)===w||(w.length>=3&&h.indexOf(w)===0))))
      s=Math.max(s,70-Math.max(0,words(b).length-ws.length)*3+(b.indexOf(ws[0])===0?10:0));
    if(s>bs){bs=s;best=x}
  });
  return {x:best,s:bs};
}
function parseItem(src){
  let s=src.trim().toLowerCase().replace(/\s+/g,' '),q=null,u=null,m;
  if(!s)return null;
  m=s.match(/^(\d+(?:\.\d+)?)\s*(kcal|cal|千卡|大卡|卡)\s*(.*)$/);
  if(m)return {src:src,e:{b:m[3]||'Quick add',z:m[3]?'':'快速添加',k:Math.round(+m[1]),p:0,f:0,c:0}};
  m=s.match(QRE);
  if(m&&(m[2]||!isZh(m[1]))&&m[0].length<s.length){q=cnum(m[1]);u=m[2]?UA[m[2]]:null;s=s.slice(m[0].length).trim()}
  else{m=s.match(TRE);if(m&&m.index>0&&(m[2]||/^\d/.test(m[1])||/[x×*]/.test(m[0]))){q=cnum(m[1]);u=m[2]?UA[m[2]]:null;s=s.slice(0,m.index).trim()}}
  const r=findFood(s),x=r.x;
  if(!x)return {src:src,e:null,s:0};
  let e;
  if(x.por){const n=q||1;e={b:x.b||x.n,z:x.z||'',k:Math.round(x.k*n),p:Math.round((x.p||0)*n*10)/10,f:Math.round((x.f||0)*n*10)/10,c:Math.round((x.c||0)*n*10)/10}}
  else{
    const one=S.gm[x.b]||(x.u?x.u[1]:100);let g;
    if(u==='g')g=q;else if(u==='kg')g=q*1000;
    else if(u)g=(q==null?1:q)*(x.u&&(x.u[0]===u||u==='piece'||u==='serving'||!UG[u])?x.u[1]:UG[u]);
    else if(q!=null)g=q>=20?q:q*one;else g=one;
    g=Math.round(g);const rr=g/100,f1=v=>Math.round(v*rr*10)/10;
    e={b:x.b,z:x.z||'',g:g,k:Math.round(x.k*rr),p:f1(x.p),f:f1(x.f),c:f1(x.c)};
  }
  return {src:src,e:e,s:r.s,q:q,u:u,x:x};
}
function parseLine(line){
  const out=[];
  line.split(/[,，、;；\n+＋]|和|\bthen\b/).forEach(ch=>{
    if(!ch.trim())return;
    let r=parseItem(ch);
    if(r&&!(r.e&&r.s>=70)&&/ and /i.test(ch)){const parts=ch.split(/ and /i).map(parseItem);if(parts.every(p=>p&&p.e))return parts.forEach(p=>out.push(p))}
    if(r)out.push(r);
  });
  return out;
}
let lp=[];
function lineBox(q){
  lp=parseLine(q);
  const ok=lp.filter(r=>r.e);
  if(!ok.length||(lp.length===1&&lp[0].q==null&&lp[0].x&&lp[0].s<70)){lp=[];return ''}
  const tk=ok.reduce((a,r)=>a+r.e.k,0);
  return '<div class="hl" style="padding:10px;border-radius:8px;margin-bottom:8px">'+lp.map(r=>r.e?'<div class="li"><span>'+esc(nm(r.e))+(r.e.g?' · '+r.e.g+'g':'')+'</span><span>'+r.e.k+' '+t('kc')+(r.e.p?', '+r.e.p+'g':'')+'</span></div>':'<div class="li mut"><span>'+esc(r.src.trim())+'</span><span>'+t('noMatch')+'</span></div>').join('')+'<div class="row"><button class="on" data-a="ladd">'+t('addAll',{n:tk})+'</button><small>'+t('lineHint')+'</small></div></div>';
}
function addLine(d){
  const ok=lp.filter(r=>r.e);if(!ok.length)return false;

function remember(it){

/* ---------- photo logging: the photo is read by Claude via api/food-photo.js ---------- */
let ph={st:''},phFile=null,phRep=-1,phTok=0;
async function shrink(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
    const s=Math.min(1,1280/Math.max(img.naturalWidth,img.naturalHeight)),cv=document.createElement('canvas');
    cv.width=Math.round(img.naturalWidth*s);cv.height=Math.round(img.naturalHeight*s);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    return cv.toDataURL('image/jpeg',.82);
  }finally{URL.revokeObjectURL(url)}
}

}

/* Free route: the user asks any AI app (豆包, Claude, ChatGPT) with aiPrompt and pastes the reply.
   Rows look like "名称 | 克数 | 热量 | 蛋白质 | 脂肪 | 碳水"; pasting into a one-line input joins the rows,
   so rows are found by pattern rather than by line. */
const NUMF='\\s*(\\d+(?:\\.\\d+)?)\\s*(?:g|ml|kcal|克|毫升|千卡|大卡)?\\s*';
const PIPE=new RegExp('([^|｜\\n]*?)\\s*[|｜]'+NUMF+'[|｜]'+NUMF+'[|｜]'+NUMF+'[|｜]'+NUMF+'[|｜]'+NUMF,'g');
function parsePipe(txt){
  const out=[];let m;PIPE.lastIndex=0;
  while((m=PIPE.exec(String(txt||'')))){
    const n=m[1].replace(/^\s*(?:碳水(?:化合物)?\s*(?:[（(]?\s*(?:克|g)\s*[)）]?)?|carb(?:ohydrate)?s?\s*(?:[(]?\s*g\s*[)]?)?)\s+/i,'').replace(/^[\s\-*•·、,，;；]+|^\d+[.、)）]\s*/g,'').trim(),v=m.slice(2,7).map(Number);
    if(!n||!(v[0]>0))continue;
    const o={g:Math.round(v[0]),k:Math.round(v[1]),p:v[2],f:v[3],c:v[4]};
    out.push({b:n,z:isZh(n)?n:'',g:o.g,k:o.k,p:o.p,f:o.f,c:o.c,o:o});
  }
  return out.slice(0,12);
}

/* ---------- food search ---------- */
function showRes(){
  const q=$('#fs').value.trim().toLowerCase(),box=$('#fr');
  if(!q){box.innerHTML='';lp=[];return}
  const lb=lineBox(q);
  const ts=q.split(/\s+/);
  fq=DB.concat(S.dbx).filter(x=>{const s=(x.b+' '+(x.al||x.z||'')+' '+(x.z||'')).toLowerCase();return ts.every(w=>s.indexOf(w)>=0)}).slice(0,6);
  box.innerHTML=lb+fq.map((x,i)=>'<button class="ch" data-a="pick" data-i="'+i+'">'+esc(nm(x))+'</button>').join('')+'<button class="ch" data-a="fask">'+t('ask')+'</button><div id="fa" class="mut"></div>';
}
function calc(){const g=parseFloat($('#fg').value)||0,r=g/100,q=v=>Math.round(v*r*10)/10;return{g:g,k:Math.round(sel.k*r),p:q(sel.p),f:q(sel.f),c:q(sel.c)}}
function updPrev(){if(!sel||!$('#fv'))return;const x=calc();$('#fv').textContent=t('portion')+': '+x.k+' '+t('kc')+' · '+t('pro')+' '+x.p+'g · '+t('fat')+' '+x.f+'g · '+t('carb')+' '+x.c+'g'}
function showSel(){
  const box=$('#fp');if(!box)return;if(!sel){box.innerHTML='';return}
  const u=sel.u,g0=S.gm[sel.b]||(u?u[1]:100);
  box.innerHTML='<div class="row hl" style="padding:10px;border-radius:8px"><b>'+esc(nm(sel))+'</b><small class="mut" style="width:100%">'+t('per100')+': '+sel.k+' '+t('kc')+' · '+sel.p+'g · '+sel.f+'g · '+sel.c+'g</small><button class="sm" data-a="gstep" data-v="-10" aria-label="-10 g">−10</button><input class="s" id="fg" type="number" inputmode="decimal" value="'+g0+'" style="width:72px"><button class="sm" data-a="gstep" data-v="10" aria-label="+10 g">+10</button><span>g</span>'+(u?'<button class="sm" data-a="unit">+1 '+esc(UN[u[0]]?UN[u[0]][L()]:u[0])+' ('+u[1]+'g)</button>':'')+'<button class="on" data-a="fadd">'+t('add')+'</button><div id="fv" style="width:100%"></div></div>';
  updPrev();

async function ask(){
  const q=$('#fs').value.trim(),m=$('#fa');if(!q||!m)return;
  m.textContent=t('askWait');
  try{
    const r=await fetch('https://world.openfoodfacts.org/cgi/search.pl?search_simple=1&action=process&json=1&page_size=10&fields=product_name,nutriments&search_terms='+encodeURIComponent(q));
    const j=await r.json();
    const r1=v=>Math.round((+v||0)*10)/10;
    const list=(j.products||[]).filter(p=>p.product_name&&p.nutriments&&p.nutriments['energy-kcal_100g']>=0).slice(0,5);
    if(!list.length)throw 0;
    fq=list.map(p=>{const n=p.nutriments;return{b:p.product_name,z:'',k:Math.round(n['energy-kcal_100g']),p:r1(n.proteins_100g),f:r1(n.fat_100g),c:r1(n.carbohydrates_100g),u:null,est:true}});
    $('#fr').innerHTML=fq.map((x,i)=>'<button class="ch" data-a="pick" data-i="'+i+'">'+esc(x.b)+' · '+x.k+' '+t('kc')+'</button>').join('')+'<div class="mut" id="fa">'+t('askOk')+'</div>';
  }catch(x){const m3=$('#fa');if(m3)m3.textContent=t('askNo')}
}

  const id=e.target.id,d=day();
  if(id==='win')d.win=e.target.value;
  else if(id==='nx')d.next=e.target.value;
  else if(id==='wt'||id==='wt2')d.wt=e.target.value;
  else if(id==='sl'||id==='sl2')d.sl=e.target.value;
  else if(id==='shq'){const el=$('#shr'),q=e.target.value.trim().toLowerCase();if(el)el.innerHTML=q?(lineBox(q)||'<button class="sm" data-a="shfull">'+t('shFull')+'</button>'):'';return}
  else if(id==='tmn'){if(S.timer){S.timer.note=e.target.value;persist()}return}
  else if(id==='stp')d.stp=e.target.value;
  else if(id==='fs'){if(/[|｜]/.test(e.target.value)&&aiLoad(e.target.value)){render();return}showRes();return}
  else if(id==='srq'){srQ=e.target.value;const el=$('#srr');if(el)el.innerHTML=srHtml();return}
  else if(id==='fg'){updPrev();return}
  else if(id.indexOf('t_')===0){const v=parseFloat(e.target.value);if(!(v>0))return;S.t[id.slice(2)]=v;touchCfg()}
  else if(id==='ic_iv'||id==='ic_mg'){const v=parseFloat(e.target.value),o=Object.assign({},S.isoc);if(v>0)o[id.slice(3)]=v;else delete o[id.slice(3)];S.isoc=o;touchCfg()}
  else if(id==='coin')return;
  else return;
  save();
});
document.addEventListener('change',e=>{
  if(e.target.id==='phf'){const f=e.target.files&&e.target.files[0];if(f)sendPhoto(f);return}
  if(e.target.id==='bfi'){const f=e.target.files&&e.target.files[0];if(f)f.text().then(txt=>{const r=restoreFrom(txt);if(r===null)return;if(r)render();const m=$('#bm');if(m)m.textContent=r?t('brok'):t('bbad')});return}
  // typing in the night note or weight saves as you go; link the plan once you leave the field
  if(['win','nx','wt','wt2'].indexOf(e.target.id)>=0){if(linkPlan(day(),cur,evSnap)){save();render()}return}
  if(e.target.dataset&&e.target.dataset.pg!=null){const x=ph.it&&ph.it[+e.target.dataset.pg],g=parseFloat(e.target.value);if(x&&g>0){phScale(x,Math.round(g));render()}return}
  if(e.target.dataset&&e.target.dataset.pt!=null){
    const d=day(),x=plan(d,cur)[+e.target.dataset.pt],v=e.target.value;if(!x||!v||v===x.t)return;
    x.t=v;delete x.auto;const c=sameTime(d,cur,x);save();render();
    toast((c.length?t('ptConf',{n:tx(c[0].n,c[0].z)}):t('ptMoved',{t:v}))+(S.cal_tok?' '+t('ptCal'):''));return;
  }
  const tp=e.target.dataset&&e.target.dataset.tp;if(!tp)return;
  const x=ensureTpl()[+e.target.dataset.i];if(!x)return;const o=x.slice();
  if(tp==='t')x[1]=e.target.value||'12:00';
  else{const v=e.target.value.trim();if(!v)return;x[2]=L()?'':v;x[3]=L()?v:''}
  touchCfg();const sp=tplSpread(o,x);save();if(sp)toast(t('tplSpread'));
});
/* ---------- keyboard: hide the bottom nav while typing ---------- */
function typing(el){return !!el&&(el.tagName==='TEXTAREA'||(el.tagName==='INPUT'&&!/checkbox|radio|file|button/.test(el.type)))}
// Hide the nav only while the keyboard is on screen. Focus alone is not enough: iOS keeps focus after Done, and a re-render can remove the focused box without a focusout.
function kbSync(){const bd=document.body;if(!bd||!bd.classList)return;const vv=window.visualViewport,on=typing(document.activeElement)&&(!vv||innerHeight-vv.height>120);bd.classList.toggle('kb',!!on)}
if(window.visualViewport&&window.visualViewport.addEventListener)window.visualViewport.addEventListener('resize',kbSync);
document.addEventListener('focusin',e=>{if(!typing(e.target))return;kbSync();setTimeout(kbSync,350);const el=e.target;setTimeout(()=>{if(el.scrollIntoView)el.scrollIntoView({block:'center',behavior:'smooth'})},320)});
document.addEventListener('focusout',()=>{setTimeout(kbSync,120)});
document.addEventListener('toggle',e=>{if(e.target.id==='tplc')tplOpen=e.target.open},true);
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.isComposing)return;
  if(e.target.id==='wx'){e.preventDefault();const b=document.querySelector('[data-a=wadd]');if(b)b.click();return}
  if(e.target.id==='shq'){e.preventDefault();const b=document.querySelector('[data-a=ladd]');if(b)b.click();return}
  if(e.target.id!=='fs')return;
  e.preventDefault();
  if(addLine(day())){sel=null;focusFs=true;save();render()}
  else if(fq.length===1){sel=fq[0];showSel()}
});
try{const qt=new URLSearchParams(location.search||'').get('tab');if(qt&&['home','food','today','act','rev','more'].indexOf(qt)>=0)tab=qt}catch(e){}
applyDisp();
initSync();
render();
</script>
