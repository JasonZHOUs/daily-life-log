async function pull(){
  const dr=await sb.from('days').select('day,data').eq('user_id',user.id);
  const cr=await sb.from('cfg').select('data').eq('user_id',user.id).maybeSingle();
  if(dr.error)throw dr.error;
  const have=new Set();
  (dr.data||[]).forEach(r=>{have.add(r.day);const j=r.data||{},l=S.days[r.day];if(!l||(j._t||0)>(l._t||0))S.days[r.day]=j;else if((l._t||0)>(j._t||0))dirty.add(r.day)});
  Object.keys(S.days).forEach(k=>{if(!have.has(k))dirty.add(k)});
  const c=cr.data&&cr.data.data;
  if(c&&c._t){if(c._t>(S._ct||0)){S.foods=c.foods||[];S.dbx=c.dbx||[];S.t=c.t||{};S.gm=c.gm||{};if(c.lang)S.lang=c.lang;S._ct=c._t}else if(c._t<(S._ct||0))cfgDirty=true}
  else cfgDirty=true;
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
}
async function afterLogin(){try{await pull();st='ok'}catch(e){st='err';console.error(e)}render();flush()}
function initSync(){
  try{
    const c=window.APP_CONFIG;
    if(!window.supabase||!c||!c.url||c.url.indexOf('YOUR')>=0){ready=true;return}
    sb=supabase.createClient(c.url,c.key);
    sb.auth.onAuthStateChange((ev,ses)=>{
      const nu=ses?ses.user:null;
      if((nu?nu.id:null)===(user?user.id:null))return;
      user=nu;
      setTimeout(()=>{if(user)afterLogin();else render()},0);
    });
    sb.auth.getSession().then(r=>{
      const s2=r.data&&r.data.session;ready=true;
      if(s2&&!user){user=s2.user;afterLogin()}else render();
    }).catch(()=>{ready=true;render()});
  }catch(e){ready=true}
}
async function doAuth(){
  const em=($('#ae').value||'').trim(),pw=$('#ap').value||'';
  authEmail=em;
  if(!em||pw.length<6){authMsg=t('authBad');render();return}
  const m=$('#am');if(m)m.textContent=t('syncing');
  try{
    const r=authMode==='in'?await sb.auth.signInWithPassword({email:em,password:pw}):await sb.auth.signUp({email:em,password:pw});
    if(r.error)throw r.error;
    if(authMode==='up'&&!(r.data&&r.data.session)){authMsg=t('confirmMail');authMode='in';render();return}
    authMsg='';
  }catch(e){authMsg=e.message||String(e);render()}
}
async function signOut(){try{await sb.auth.signOut()}catch(e){}user=null;st='local';render()}

function shelf(){
  const cnt={},last={};
  for(let i=0;i<30;i++){const d=S.days[shift(cur,-i)];if(!d||!d.food)continue;d.food.forEach(e=>{const q=e.b||e.n;cnt[q]=(cnt[q]||0)+1;if(!last[q])last[q]=e})}
  const fr=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).slice(0,8).map(q=>last[q]);
  const have=new Set(fr.map(e=>e.b||e.n));
  return fr.concat(PRE.concat(S.foods).filter(e=>!have.has(e.b||e.n))).slice(0,16);
}

function week(){
  let h='',gy=0,en=0,mm=0,st2=0,miss=0;
  for(let i=6;i>=0;i--){
    const k=shift(cur,-i),d=S.days[k]?norm(S.days[k]):null;
    const kc=d?sum(d,'k'):0,m=d?tot(d):0;
    if(d&&d.gym.length)gy++;if(d&&d.eng)en++;mm+=m;
    h+='<div class="wc"><div class="bw"><i style="height:'+Math.min(100,kc/T().k*100)+'%"></i></div><small>'+new Date(k+'T00:00:00').toLocaleDateString(L()?'zh-CN':undefined,{weekday:'narrow'})+'</small><small>'+m+'m</small></div>';
  }
  for(let i=0;i<60;i++){
    const d=S.days[shift(cur,-i)],act=d&&(tot(norm(d))>0||d.gym.length||d.eng);
    if(act){st2++;miss=0}else{miss++;if(i>0&&miss>=2)break}
  }
  return '<div class="c"><h2>'+t('week')+'</h2><div class="wk">'+h+'</div><p>'+t('gd')+': <b>'+gy+'</b> · '+t('ed')+': <b>'+en+'</b> · '+t('wm')+': <b>'+mm+'</b></p><p>'+t('streak',{n:st2})+'</p></div>';
}
function trend(){
  const ws=Object.keys(S.days).filter(k=>parseFloat(S.days[k].wt)>0).sort().map(k=>({k:k,w:parseFloat(S.days[k].wt)}));
  if(ws.length<2)return '<div class="c"><h2>'+t('trendT')+'</h2><p class="mut">'+t('trendNone')+'</p></div>';
  const last=ws[ws.length-1],pts=ws.slice(-12);
  const lo=Math.min.apply(null,pts.map(p=>p.w))-.5,hi=Math.max.apply(null,pts.map(p=>p.w))+.5;
  const xs=i=>10+i*(280/(pts.length-1)),ys=w=>70-(w-lo)/(hi-lo)*60;
  const line=pts.map((p,i)=>xs(i)+','+ys(p.w)).join(' ');
  const dots=pts.map((p,i)=>'<circle cx="'+xs(i)+'" cy="'+ys(p.w)+'" r="3" style="fill:var(--ac)"/>').join('');
  const ref=ws.filter(p=>(new Date(last.k)-new Date(p.k))/864e5>=10).pop();
  let hint=t('h0');
  if(ref){const r=(last.w-ref.w)/((new Date(last.k)-new Date(ref.k))/864e5)*7,rr=r.toFixed(2);hint=r<0.15?t('h1',{r:rr}):r>0.6?t('h2',{r:rr}):t('h3',{r:rr})}
  return '<div class="c"><h2>'+t('trendT')+'</h2><svg viewBox="0 0 300 80" width="100%" role="img" aria-label="'+t('trendT')+'"><polyline points="'+line+'" style="fill:none;stroke:var(--ac);stroke-width:2"/>'+dots+'</svg><p class="mut">'+esc(last.w)+' kg · '+last.k+'. '+hint+'</p></div>';
}
function heat(){
  let c='';
  for(let i=83;i>=0;i--){
    const d=S.days[shift(cur,-i)];let l=0;
    if(d){norm(d);l=(tot(d)>0)+(d.gym.length>0)+(!!d.eng)+(d.food.length>0)}
    c+='<i class="l'+Math.min(3,l)+'" title="'+shift(cur,-i)+'"></i>';
  }
  return '<div class="c"><h2>'+t('heatT')+'</h2><div class="hm">'+c+'</div><p class="mut">'+t('heatNote')+'</p></div>';
}

function render(){
  if(sb&&!ready){$('#app').innerHTML='';$('#tabs').innerHTML='';return}
  if(sb&&!user&&!skip){$('#app').innerHTML=vAuth();$('#tabs').innerHTML='';return}
  const d=day(),k=sum(d,'k'),p=sum(d,'p'),f=sum(d,'f'),c=sum(d,'c');
  document.title=t('title');document.documentElement.lang=L()?'zh':'en';
  let h=header();
  h+=tab==='today'?vToday(d,k,p,f,c):tab==='food'?vFood(d):tab==='act'?vAct(d,k):vRev();

  const TB=[['today','🏠',t('today')],['food','🍽',t('food')],['act','🏃',t('act')],['rev','📈',t('review')]];
  $('#tabs').innerHTML=TB.map(x=>'<button data-a="tab" data-t="'+x[0]+'" class="'+(tab===x[0]?'on':'')+'"><span>'+x[1]+'</span>'+x[2]+'</button>').join('');

}

async function ask(){
  const q=$('#fs').value.trim(),m=$('#fa');if(!q||!m)return;
  m.textContent=t('askWait');
  try{
    const r=await fetch('https://world.openfoodfacts.org/cgi/search.pl?search_simple=1&action=process&json=1&page_size=10&fields=product_name,nutriments&search_terms='+encodeURIComponent(q));
    const j=await r.json();
    const r1=v=>Math.round((+v||0)*10)/10;
    const list=(j.products||[]).filter(p=>p.product_name&&p.nutriments&&p.nutriments['energy-kcal_100g']>=0).slice(0,5);
    if(!list.length)throw 0;
    fq=list.map(p=>{const n=p.nutriments;return{b:p.product_name,z:'',k:Math.round(n['energy-kcal_100g']),p:r1(n.proteins_100g),f:r1(n.fat_100g),c:r1(n.carbohydrates_100g),u:null,est:true}});
    $('#fr').innerHTML=fq.map((x,i)=>'<button class="ch" data-a="pick" data-i="'+i+'">'+esc(x.b)+' · '+x.k+' '+t('kc')+'</button>').join('')+'<div class="mut" id="fa">'+t('askOk')+'</div>';
  }catch(x){const m3=$('#fa');if(m3)m3.textContent=t('askNo')}
}
function tick(){
  if(!tm)return;
  const r=Math.max(0,Math.round((tm.end-Date.now())/1000));
  if(r<=0){clearInterval(tm.iv);const dd=day(tm.k);dd.min[tm.c]+=10;const keep=cur;cur=tm.k;save();cur=keep;tm=null;note=t('doneT');render();return}
  const el=$('#tt');if(el)el.textContent=pad(Math.floor(r/60))+':'+pad(r%60);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,d=day();
  if(a==='auth'){doAuth();return}
  else if(a==='amode'){authMode=authMode==='in'?'up':'in';authMsg='';render();return}
  else if(a==='skip'){skip=true;render();return}
  else if(a==='signout'){signOut();return}
  else if(a==='tab'){tab=b.dataset.t;sel=null;focusFs=(tab==='food')}
  else if(a==='prev'){cur=shift(cur,-1)}
  else if(a==='next'){cur=shift(cur,1)}
  else if(a==='today'){cur=ymd(new Date())}
  else if(a==='lang'){S.lang=L()?'en':'zh';touchCfg()}
  else if(a==='shelf'){const x=shl[+b.dataset.i];if(x)d.food.push(Object.assign({},x))}
  else if(a==='pick'){sel=fq[+b.dataset.i];showSel();return}
  else if(a==='unit'){const g=$('#fg');g.value=(parseFloat(g.value)||0)+sel.u[1];updPrev();return}
  else if(a==='fadd'){
    if(!sel)return;const x=calc();if(x.g<=0)return;
    d.food.push({b:sel.b,z:sel.z||'',g:x.g,k:x.k,p:x.p,f:x.f,c:x.c});
    S.gm[sel.b]=x.g;
    if(sel.est&&!S.dbx.some(y=>y.b===sel.b))S.dbx.push({b:sel.b,z:'',al:'',k:sel.k,p:sel.p,f:sel.f,c:sel.c,u:null});
    touchCfg();sel=null;
  }
  else if(a==='fask'){ask();return}
  else if(a==='kadd'){const kk=parseInt($('#qk').value,10);if(!(kk>0))return;d.food.push({b:'Quick add',z:'快速添加',k:kk,p:0,f:0,c:0})}
  else if(a==='cadd'){
    const n=$('#cn').value.trim(),kk=parseInt($('#ck').value,10),pp=parseFloat($('#cp').value)||0,ff=parseFloat($('#cf').value)||0,cc=parseFloat($('#cc').value)||0;
    if(!n||!(kk>0))return;
    const e1={b:n,z:'',k:kk,p:pp,f:ff,c:cc};d.food.push(Object.assign({},e1));
    const j=S.foods.findIndex(x=>(x.b||x.n)===n);if(j<0)S.foods.push(e1);else S.foods[j]=e1;touchCfg();
  }
  else if(a==='ycopy'){const py=S.days[shift(cur,-1)];if(!py||!py.food||!py.food.length)return;py.food.forEach(x=>d.food.push(Object.assign({},x)))}
  else if(a==='del'){d.food.splice(+b.dataset.i,1)}
  else if(a==='gym'){const g=b.dataset.g,i=d.gym.indexOf(g);if(i<0)d.gym.push(g);else d.gym.splice(i,1)}
  else if(a==='min'){const c=b.dataset.c;d.min[c]=Math.max(0,d.min[c]+parseInt(b.dataset.v,10))}
  else if(a==='start'){if(tm)return;note='';tm={end:Date.now()+600000,c:$('#tc').value,k:cur,iv:setInterval(tick,1000)}}
  else if(a==='exadd'){const i=+$('#ea').value,m=parseFloat($('#em').value);if(!(m>0))return;d.ex.push({a:i,m:m,k:Math.round(ACT[i][2]*W()*m/60)})}
  else if(a==='exdel'){d.ex.splice(+b.dataset.i,1)}
  else if(a==='padd'){const nn=$('#pn').value.trim();if(!nn)return;plan(d,cur).push({t:$('#pt').value||'12:00',n:nn,z:'',x:false})}
  else if(a==='pdel'){plan(d,cur).splice(+b.dataset.i,1)}
  else if(a==='pdone'){plan(d,cur)[+b.dataset.i].x=b.checked}
  else if(a==='eng'){d.eng=b.checked}
  else if(a==='supp'){d.supp=b.checked}
  else if(a==='bshow'){$('#bk').value=JSON.stringify(S);$('#bm').textContent=t('bok');return}
  else if(a==='bcopy'){const x=$('#bk');x.select();let ok=false;try{ok=document.execCommand('copy')}catch(z){}try{navigator.clipboard.writeText(x.value)}catch(z){}$('#bm').textContent=ok?t('bcp'):t('bman');return}
  else if(a==='brest'){try{const o=JSON.parse($('#bk').value);if(!o||!o.days)throw 0;S=Object.assign({days:{},foods:[],dbx:[],t:{},gm:{},lang:S.lang},o);Object.keys(S.days).forEach(k=>{S.days[k]._t=Date.now();dirty.add(k)});touchCfg();save();render();$('#bm').textContent=t('brok')}catch(x){$('#bm').textContent=t('bbad')}return}
  save();render();
});
document.addEventListener('input',e=>{
  const id=e.target.id,d=day();
  if(id==='win')d.win=e.target.value;
  else if(id==='nx')d.next=e.target.value;
  else if(id==='wt')d.wt=e.target.value;
  else if(id==='fs'){showRes();return}
  else if(id==='fg'){updPrev();return}
  else if(id.indexOf('t_')===0){const v=parseFloat(e.target.value);if(!(v>0))return;S.t[id.slice(2)]=v;touchCfg()}
  else return;
  save();
});
initSync();
render();
</script>
</body>
</html>
