:root[data-theme="dark"]{--bg:#10171c;--card:#18222a;--tx:#e8eef0;--mut:#93a3ab;--ac:#82a6ff;--onac:#0c1626;--bd:#2a3841;--hi:#3a3216;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.w{max-width:560px;margin:0 auto;padding:10px 14px 110px}
.mut,small{color:var(--mut)}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
.c h2{font:600 17px/1.2 "Iowan Old Style",Georgia,serif;margin:0 0 10px}
.hl{background:var(--hi)}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;min-height:42px;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.on{background:var(--ac);color:var(--onac);border-color:var(--ac)}
button.sm{min-height:32px;padding:4px 10px;font-size:14px}
.ch{margin:0 6px 8px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.sp{flex:1}
.nav{display:flex;gap:8px;align-items:center;justify-content:space-between}
.nav b{font:600 20px/1.2 "Iowan Old Style",Georgia,serif;text-align:center}
.m{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:4px 0 6px}
.m i{display:block;height:100%;background:var(--ac)}
.kc b{font:600 46px/1 "Iowan Old Style",Georgia,serif}
.kc span{color:var(--mut);margin-left:6px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.li{display:flex;gap:8px;justify-content:space-between;align-items:center;font-size:14px;border-top:1px solid var(--bd);padding:4px 0}
input,textarea,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;width:100%}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--ac)}
input.s{width:80px}
input.g{flex:1;min-width:120px;width:auto}
input.big{font-size:17px;padding:12px}
label.ck{display:flex;gap:10px;align-items:center;margin:8px 0}
.shelf{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.shelf button{flex:0 0 auto;max-width:200px;text-align:left}
.wk{display:flex;gap:6px}
.wc{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center}
.bw{height:60px;display:flex;align-items:flex-end;width:100%}
.bw i{display:block;width:100%;min-height:2px;background:var(--ac);border-radius:4px 4px 0 0}
.hm{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
.hm i{display:block;aspect-ratio:1;border-radius:3px;background:var(--bd)}
.hm i.l1{background:var(--ac);opacity:.4}.hm i.l2{background:var(--ac);opacity:.7}.hm i.l3{background:var(--ac)}
textarea{resize:vertical}
details summary{cursor:pointer;font-weight:600}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs button{flex:1;border:0;border-radius:0;background:none;min-height:58px;font-size:12px;display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center;color:var(--mut)}
.tabs button span{font-size:20px;line-height:1}
.tabs button.on{background:none;color:var(--ac);font-weight:600}
</style>
</head>

async function flush(){
  if(!user)return;
  try{
    const keys=Array.from(dirty).filter(k=>S.days[k]);
    if(keys.length){
      const rows=keys.map(k=>({user_id:user.id,day:k,data:S.days[k],updated_at:new Date().toISOString()}));
      const r=await sb.from('days').upsert(rows,{onConflict:'user_id,day'});if(r.error)throw r.error;
      keys.forEach(k=>dirty.delete(k));
    }
    if(cfgDirty){
      const r=await sb.from('cfg').upsert({user_id:user.id,data:{foods:S.foods,dbx:S.dbx,t:S.t,gm:S.gm,meals:S.meals,tpl:S.tpl,lang:S.lang,_t:S._ct},updated_at:new Date().toISOString()},{onConflict:'user_id'});
      if(r.error)throw r.error;cfgDirty=false;
    }
    st='ok';
  }catch(e){st='err';console.error(e);retryLater()}
  updSync();
}
async function pull(){
  const dr=await sb.from('days').select('day,data').eq('user_id',user.id);
  const cr=await sb.from('cfg').select('data').eq('user_id',user.id).maybeSingle();
  if(dr.error)throw dr.error;
  const have=new Set();
  (dr.data||[]).forEach(r=>{have.add(r.day);const j=r.data||{},l=S.days[r.day];if(!l||(j._t||0)>(l._t||0))S.days[r.day]=j;else if((l._t||0)>(j._t||0))dirty.add(r.day)});
  Object.keys(S.days).forEach(k=>{if(!have.has(k))dirty.add(k)});
  const c=cr.data&&cr.data.data;
  if(c&&c._t){if(c._t>(S._ct||0)){S.foods=c.foods||[];S.dbx=c.dbx||[];S.t=c.t||{};S.gm=c.gm||{};S.meals=c.meals||[];S.tpl=c.tpl||null;if(c.lang)S.lang=c.lang;S._ct=c._t}else if(c._t<(S._ct||0))cfgDirty=true}
  else cfgDirty=true;

}

const NUM={'一':1,'二':2,'两':2,'俩':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10,'半':.5,a:1,an:1,one:1,two:2,three:3,four:4,five:5,six:6,half:.5};

function findFood(n){

    const j=await r.json();
    const r1=v=>Math.round((+v||0)*10)/10;
    const list=(j.products||[]).filter(p=>p.product_name&&p.nutriments&&p.nutriments['energy-kcal_100g']>=0).slice(0,5);
    if(!list.length)throw 0;
    fq=list.map(p=>{const n=p.nutriments;return{b:p.product_name,z:'',k:Math.round(n['energy-kcal_100g']),p:r1(n.proteins_100g),f:r1(n.fat_100g),c:r1(n.carbohydrates_100g),u:null,est:true}});
    $('#fr').innerHTML=fq.map((x,i)=>'<button class="ch" data-a="pick" data-i="'+i+'">'+esc(x.b)+' · '+x.k+' '+t('kc')+'</button>').join('')+'<div class="mut" id="fa">'+t('askOk')+'</div>';
  }catch(x){const m3=$('#fa');if(m3)m3.textContent=t('askNo')}
}
function tick(){
  if(!tm)return;
  const r=Math.max(0,Math.round((tm.end-Date.now())/1000));
  if(r<=0){clearInterval(tm.iv);const dd=day(tm.k);dd.min[tm.c]+=10;const keep=cur;cur=tm.k;save();cur=keep;tm=null;note=t('doneT');render();return}
  const el=$('#tt');if(el)el.textContent=pad(Math.floor(r/60))+':'+pad(r%60);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,d=day();
  if(a==='auth'){doAuth();return}
  else if(a==='amode'){authMode=authMode==='in'?'up':'in';authMsg='';render();return}
  else if(a==='skip'){skip=true;render();return}
  else if(a==='signout'){signOut();return}
  else if(a==='reload'){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(z){}location.reload();return}
  else if(a==='tab'){tab=b.dataset.t;sel=null;focusFs=(tab==='food')}
  else if(a==='prev'){cur=shift(cur,-1)}
  else if(a==='next'){cur=shift(cur,1)}
  else if(a==='today'){cur=ymd(new Date())}
  else if(a==='lang'){S.lang=L()?'en':'zh';touchCfg()}
  else if(a==='shelf'){const x=shl[+b.dataset.i];if(x)d.food.push(Object.assign({},x))}
  else if(a==='pick'){sel=fq[+b.dataset.i];showSel();return}
  else if(a==='unit'){const g=$('#fg');g.value=(parseFloat(g.value)||0)+sel.u[1];updPrev();return}
  else if(a==='fadd'){
    if(!sel)return;const x=calc();if(x.g<=0)return;
    d.food.push({b:sel.b,z:sel.z||'',g:x.g,k:x.k,p:x.p,f:x.f,c:x.c});
    S.gm[sel.b]=x.g;
    if(sel.est&&!S.dbx.some(y=>y.b===sel.b))S.dbx.push({b:sel.b,z:'',al:'',k:sel.k,p:sel.p,f:sel.f,c:sel.c,u:null});
    touchCfg();sel=null;
  }
  else if(a==='fask'){ask();return}
  else if(a==='ladd'){if(!addLine(d))return;sel=null;focusFs=true}
  else if(a==='meal'){const m=S.meals.find(x=>x.key===b.dataset.k);if(!m)return;m.it.forEach(e=>d.food.push(Object.assign({},e)));m.n++;m.t=Date.now();touchCfg()}
  else if(a==='kadd'){const kk=parseInt($('#qk').value,10);if(!(kk>0))return;d.food.push({b:'Quick add',z:'快速添加',k:kk,p:0,f:0,c:0})}
  else if(a==='cadd'){
    const n=$('#cn').value.trim(),kk=parseInt($('#ck').value,10),pp=parseFloat($('#cp').value)||0,ff=parseFloat($('#cf').value)||0,cc=parseFloat($('#cc').value)||0;
    if(!n||!(kk>0))return;
    const e1={b:n,z:'',k:kk,p:pp,f:ff,c:cc};d.food.push(Object.assign({},e1));
    const j=S.foods.findIndex(x=>(x.b||x.n)===n);if(j<0)S.foods.push(e1);else S.foods[j]=e1;touchCfg();
  }
  else if(a==='ycopy'){const py=S.days[shift(cur,-1)];if(!py||!py.food||!py.food.length)return;py.food.forEach(x=>d.food.push(Object.assign({},x)))}
  else if(a==='del'){d.food.splice(+b.dataset.i,1)}
  else if(a==='gym'){const g=b.dataset.g,i=d.gym.indexOf(g);if(i<0)d.gym.push(g);else d.gym.splice(i,1)}
  else if(a==='min'){const c=b.dataset.c;d.min[c]=Math.max(0,d.min[c]+parseInt(b.dataset.v,10))}
  else if(a==='start'){if(tm)return;note='';tm={end:Date.now()+600000,c:$('#tc').value,k:cur,iv:setInterval(tick,1000)}}
  else if(a==='exadd'){const i=+$('#ea').value,m=parseFloat($('#em').value);if(!(m>0))return;d.ex.push({a:i,m:m,k:Math.round(ACT[i][2]*W()*m/60)})}
  else if(a==='exdel'){d.ex.splice(+b.dataset.i,1)}
  else if(a==='padd'){const nn=$('#pn').value.trim();if(!nn)return;plan(d,cur).push({t:$('#pt').value||'12:00',n:nn,z:'',x:false})}
  else if(a==='pdel'){plan(d,cur).splice(+b.dataset.i,1)}
  else if(a==='pdone'){plan(d,cur)[+b.dataset.i].x=b.checked}
  else if(a==='tadd'){ensureTpl().push(['0123456','12:00',L()?'':t('tplNew'),L()?t('tplNew'):'']);touchCfg()}
  else if(a==='tdel'){ensureTpl().splice(+b.dataset.i,1);touchCfg()}
  else if(a==='twd'){const x=ensureTpl()[+b.dataset.i],w=b.dataset.w;if(!x)return;x[0]=x[0].indexOf(w)>=0?x[0].replace(w,''):x[0]+w;touchCfg()}
  else if(a==='tdef'){S.tpl=null;touchCfg()}
  else if(a==='treset'){delete d.plan;plan(d,cur);save();render();const m=$('#tmsg');if(m)m.textContent=t('tplOk');return}
  else if(a==='eng'){d.eng=b.checked}
  else if(a==='supp'){d.supp=b.checked}
  else if(a==='csv'){dlCSV();return}
  else if(a==='bshow'){$('#bk').value=JSON.stringify(S);$('#bm').textContent=t('bok');return}
  else if(a==='bcopy'){const x=$('#bk');x.select();let ok=false;try{ok=document.execCommand('copy')}catch(z){}try{navigator.clipboard.writeText(x.value)}catch(z){}$('#bm').textContent=ok?t('bcp'):t('bman');return}
  else if(a==='brest'){try{const o=JSON.parse($('#bk').value);if(!o||!o.days)throw 0;S=Object.assign({days:{},foods:[],dbx:[],t:{},gm:{},meals:[],tpl:null,lang:S.lang},o);Object.keys(S.days).forEach(k=>{S.days[k]._t=Date.now();dirty.add(k)});touchCfg();save();render();$('#bm').textContent=t('brok')}catch(x){$('#bm').textContent=t('bbad')}return}
  save();render();
});
document.addEventListener('input',e=>{
  const id=e.target.id,d=day();
  if(id==='win')d.win=e.target.value;
  else if(id==='nx')d.next=e.target.value;
  else if(id==='wt')d.wt=e.target.value;
  else if(id==='fs'){showRes();return}
  else if(id==='fg'){updPrev();return}
  else if(id.indexOf('t_')===0){const v=parseFloat(e.target.value);if(!(v>0))return;S.t[id.slice(2)]=v;touchCfg()}
  else return;
  save();
});
document.addEventListener('change',e=>{
  const tp=e.target.dataset&&e.target.dataset.tp;if(!tp)return;
  const x=ensureTpl()[+e.target.dataset.i];if(!x)return;
  if(tp==='t')x[1]=e.target.value||'12:00';
  else{const v=e.target.value.trim();if(!v)return;x[2]=L()?'':v;x[3]=L()?v:''}
  touchCfg();save();
});
document.addEventListener('toggle',e=>{if(e.target.id==='tplc')tplOpen=e.target.open},true);
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.isComposing||e.target.id!=='fs')return;
  e.preventDefault();
  if(addLine(day())){sel=null;focusFs=true;save();render()}
  else if(fq.length===1){sel=fq[0];showSel()}
});
initSync();
render();
</script>
</body>
</html>
